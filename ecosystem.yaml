services:
- id: watcher-cog
  type: trigger-cog
  status: active
  dod_type: new_cog
  language: python
  cog_subtype: trigger
  host: aws-lambda
  description: 'Config-driven Google Drive folder watcher. An AWS Lambda function
    on a 1-minute EventBridge schedule (ADR-011), declared in mini-app-polis/infra
    (modules/scheduled-worker): each tick polls the Drive API and asks api-kaianolevine-com to run the cog that owns a folder when
    files change — once per folder for deejay-cog, once per changed file for
    transcription-cog. The API enqueues; watcher holds no queue key.

    '
- id: deejay-cog
  type: pipeline-cog
  status: active
  dod_type: new_cog
  language: python
  cog_subtype: pipeline
  host: aws-lambda
  description: 'DJ set CSV processor. Normalizes, validates, and ingests DJ set data
    into PostgreSQL via api-kaianolevine-com.

    '
- id: evaluator-cog
  type: pipeline-cog
  status: active
  dod_type: new_cog
  language: python
  cog_subtype: pipeline
  host: aws-lambda
  description: 'AI evaluation cog. Structural conformance checking on demand, as
    an AWS Lambda function behind its own SQS queue (evaluator-jobs):
    api-kaianolevine-com enqueues one job per repository — POST
    /v1/evaluations/runs for one repository when it releases, POST
    /v1/evaluations/fleet for the whole registry when the standards catalog or
    the evaluator releases. No schedule (evaluator-cog ADR-0004). Reads the compiled rule catalog
    from the API rather than checking out ecosystem-standards. All findings written to pipeline_evaluations table via api-kaianolevine-com
    with source field distinguishing evaluation type.

    '
- id: transcription-cog
  type: pipeline-cog
  status: active
  dod_type: new_cog
  language: python
  cog_subtype: pipeline
  host: aws-lambda
  description: 'Two pipelines in one Lambda function behind its own FIFO SQS queue
    (transcription-jobs.fifo). watcher-cog asks api-kaianolevine-com for one run per
    changed Drive file, and one message is one file (ADR-007):

    * mode "wcs-transcripts" — a WCS lesson transcript from the notes input
    folder: an LLM extracts structured notes, raw transcript and extraction are
    stored through api-kaianolevine-com (wcs_transcripts, wcs_sources), and the
    file is archived. Consumed by wcs.kaianolevine.com.

    * mode "voicenotes" — a voice note from voice-inbox/: Whisper transcribes,
    Claude extracts a task, which is handed to task-manager-cog through
    POST /v1/tasks with the Drive file id in its external id for idempotency,
    the audio is archived to processed/YYYY-MM-DD/, and the retention sweep
    runs.

    * mode "voicenotes-cleanup" — the retention sweep on its own, for an
    operator; names no file.

    Both pipelines report under the transcription-cog repo identifier, told
    apart by flow_name (process-transcript, voicenotes-ingest). Merged from
    notes-ingest-cog and voicenotes-cog in May 2026 (ADR-004); those
    identifiers are retired.

    '
- id: wiki-curator-cog
  type: pipeline-cog
  status: active
  dod_type: new_cog
  language: python
  cog_subtype: pipeline
  host: railway
  description: 'Reads structured WCS notes from api-kaianolevine-com and maintains
    the wcs-wiki markdown knowledge base.

    Off Prefect as of 2026-09-23 and, for now, on Railway: a one-shot process,
    one wake is one run, no resident container and no queue. It did not follow
    the other three onto Lambda because GitPython needs a git executable the
    managed python3.11 runtime does not ship, and because a full idempotent
    re-render takes no arguments — every queue message would be identical. See
    wiki-curator-cog ADR-004.

    It is moving to Lambda (decided 2026-10-14) once that design is finished.
    Until then the pipeline-cog rules that describe a queue-driven Lambda —
    PIPE-016, PIPE-017, PIPE-018, PIPE-020, CD-010 and CD-024 — are exempted
    in its evaluator.yaml rather than deferred: they describe a runtime it
    does not have yet. ADR-013 records this, and db-ops, as the exceptions
    to ADR-009.

    PIPE-016 and PIPE-019 still fail a repo that declares prefect. That check
    stays: it is now a guard against regression rather than a description of
    where the fleet is, and it is deliberately kept rather than retired with
    the runtime it was written for.

    status: active as of 2026-09-23, and that is what puts it in the sweep.
    Registering it was not enough on its own: fleet_registry.active_services()
    keeps only status == active, so while it said development the fan-out
    skipped it and it was graded only when it cut a release — never regraded
    when the catalog moved. It declared itself conformance-managed and was
    enumerated by nothing.

    '
- id: task-manager-cog
  type: pipeline-cog
  status: development
  dod_type: new_cog
  language: python
  cog_subtype: pipeline
  host: aws-lambda
  description: 'The one writer to the Asana task board. A Lambda function behind
    its own FIFO SQS queue (task-manager-jobs.fifo, one message group). Sources
    of tasks ask api-kaianolevine-com (POST /v1/tasks) with a task draft, and
    the API enqueues it; the worker looks up the source''s external id, composes
    the board''s template, mints the task id for its source (VN- for voice
    notes) or takes the one it brings (repo#n for issues), and creates the task.
    No model calls. See task-manager-cog ADR-001.

    '
- id: db-ops
  type: pipeline-cog
  status: active
  dod_type: new_cog
  language: python
  cog_subtype: pipeline
  host: railway
  description: 'Postgres operations for the two production databases on Railway
    (Postgres and Postgres-deejaytools). One repository, three Railway cron
    services in production, each with its own start command so a failure in one
    cannot hide in another: db-poller publishes metrics to CloudWatch, db-backup
    takes a nightly pg_dump of both databases to S3 (the copy that is not on
    Railway), and db-drill restores from PITR and from the S3 dump and verifies
    the result. All three reach the databases over Railway private networking,
    which is why they are not Lambda functions (db-ops ADR-001).

    Registered as pipeline-cog rather than a new type; the queue- and
    Lambda-shaped rules are exemptions in its evaluator.yaml (ADR-013).

    '
- id: api-kaianolevine-com
  type: api-service
  status: active
  dod_type: new_fastapi_service
  language: python
  framework: fastapi
  host: railway
  description: 'Primary ecosystem API. DJ sets, tracks, catalog, evaluations, feature
    flags, contact form, resume endpoints. Sole API for the kaianolevine.com ecosystem.

    '
- id: identity
  type: shared-library
  status: active
  dod_type: null
  language: python
  package: miniapppolis-identity
  description: "The cross-ecosystem identity and authorization contract. Defines one\
    \ binding \u2014 verify, resolve, authorize, emit_audit \u2014 plus the principal\
    \ store schema, the scope vocabulary, the decision function, and cross-language\
    \ conformance fixtures. Consumed by each enforcement point rather than run as\
    \ a service: one specification, N conformant enforcement points, deliberately\
    \ not a central auth service on the request path. Verifies Clerk session JWTs\
    \ for humans and named per-machine API keys for cogs. See ADR-008, CD-019, CD-029, CD-030, AUTH-004.\n"
- id: common-python-utils
  type: shared-library
  status: active
  dod_type: null
  language: python
  package: miniapppolis-common-utils
  description: "Shared Python utilities. Google API client (Drive, Sheets), LLM client\
    \ (Anthropic, OpenAI), structured logging, metadata helpers, and KaianoApiClient\
    \ \u2014 the ecosystem API client, which resolves the caller's own named machine\
    \ key from the environment and sets the Authorization header (CD-019, AUTH-002).\
    \ All Python processors and cogs declare this as a dependency.\n"
- id: ecosystem-standards
  type: standards-repo
  status: active
  dod_type: null
  language: yaml
  host: github
  description: 'Machine-readable ecosystem standards. Single source of truth for all
    architectural decisions, patterns, and conventions. Versioned YAML files consumed
    by evaluator-cog at runtime. Semantic-release owns versioning via index.yaml.

    '
- id: .github
  type: shared-workflows
  status: active
  dod_type: null
  language: yaml
  host: github
  description: "The org-wide GitHub configuration repo. Holds the fleet's reusable\
    \ workflows: security.yml (secret scanning, a dependency audit, static analysis\
    \ and SBOM generation), python-test.yml, lambda-deploy.yml, evaluate.yml, promote.yml,\
    \ automerge.yml, railway-plan.yml and railway-apply.yml. SEC-002 through\
    \ SEC-005 accept a job delegating to it in place of inline steps; registering\
    \ it here is what makes that honest, because the steps are then evaluated once\
    \ rather than being invisible in every consumer. Consumers pin the moving `v3`\
    \ tag; a breaking change gets `v4` instead. No release automation \u2014 CHANGELOG.md\
    \ is maintained by hand.\n"
- id: infra
  type: infrastructure
  status: active
  dod_type: null
  language: hcl
  host: aws
  description: 'The AWS account in Terraform: one root, remote state in S3, the
    account''s shared resources, and every pipeline cog''s runtime through one
    cog-worker module block per cog (ADR-010). Plans on pull requests from dev and
    applies on merge to main through a GitHub OIDC role; no releases.

    '
- id: api-deejaytools
  type: api-service
  status: active
  dod_type: new_fastapi_service
  language: python
  framework: fastapi
  host: railway
  description: 'FastAPI API for deejaytools.com. Replaced the retired Hono API on the
    same PostgreSQL database with the same wire contract.
    Events, floor trial sessions and their queues, check-ins, partners, teams, songs
    and their Google Drive files. Clerk auth, scope-based authorization through the
    identity library. Serves deejaytools-com.

    '
- id: deejaytools-com
  type: react-app
  status: active
  dod_type: new_react_app
  language: typescript
  framework: react
  host: cloudflare-pages
  description: "React web application for deejaytools.com. WCS routine management\
    \ platform \u2014 events, sessions, floor trials, check-in queue, partner and\
    \ song management. Vite + React + Tailwind + shadcn/ui. Talks to api-deejaytools.\n"
- id: website-astro-software
  type: static-site
  status: active
  dod_type: new_frontend_site
  language: astro
  host: cloudflare-pages
  description: "Software portfolio site. Queries api-kaianolevine-com live for DJ\
    \ sets, catalog, stats, and evaluation findings. Hosts the feature flag admin\
    \ panel at /admin (Clerk-authenticated, admin role required) \u2014 the canonical\
    \ management surface for toggling flags across the ecosystem.\n"
- id: website-astro-wcs
  type: static-site
  status: active
  dod_type: new_frontend_site
  language: astro
  host: cloudflare-pages
  description: West Coast Swing personal site. wcs.kaianolevine.com.
- id: website-astro-wcsmn
  type: static-site
  status: active
  dod_type: new_frontend_site
  language: astro
  host: cloudflare-pages
  description: "West Coast Swing community resource for Minnesota \u2014 events and\
    \ organizations. wcsmn.com. Read-only: the site never authenticates or writes,\
    \ and the homepage calendar reads the Google Calendar API from the browser.\n"
- id: kwalla-dance
  type: static-site
  status: active
  dod_type: new_frontend_site
  language: astro
  host: cloudflare-pages
  description: "Personal site for Kristen Wallace (WCS instructor), kristenwallace.com.\
    \ Freelance build. Events are baked in at build time from a public iCloud feed,\
    \ so a scheduled workflow pings the Cloudflare Pages deploy hook twice daily to\
    \ pick up new events without her touching anything.\n"
patterns:
  drive_trigger:
    description: How Drive file drops trigger processor flows
    current: 'watcher-cog (a scheduled Lambda, 1-minute tick) polls the Drive API
      → POSTs to api-kaianolevine-com (/v1/deejay/runs, /v1/transcription/runs) →
      the API enqueues onto the owning cog''s SQS queue'
  orchestration:
    description: How pipelines are scheduled and executed
    current: 'SQS + Lambda (ADR-009, ADR-010). api-kaianolevine-com is the only
      producer; each pipeline cog is a Lambda function behind its own queue,
      declared in mini-app-polis/infra. wiki-curator-cog and db-ops run as
      one-shot Railway processes instead.'
  python_shared_library:
    description: Shared Python utility library name
    current: common-python-utils
  api_services:
    description: Active API services
    current: api-kaianolevine-com (sole API for kaianolevine.com ecosystem)
  auth:
    description: How callers authenticate to ecosystem APIs
    current: "Single Authorization: Bearer header. Humans present Clerk session JWTs,\
      \ verified locally against JWKS. Machines present a named per-machine API key\
      \ held only in Doppler as <MACHINE_NAME>_API_KEY, verified locally by constant-time\
      \ comparison \u2014 the key is the identity claim. Both paths run through the\
      \ identity library.\n"
  authorization:
    description: How access is granted once a caller is identified
    current: 'Roles are named bundles of scopes; a scope is <domain>.<resource>.<action>.
      Every non-public route names the one scope it requires. Machine principals and
      their roles are declared in code and reconciled into the principal store at
      boot.

      '
terminology:
  cog:
    definition: 'A Python worker with no HTTP server and no port binding. Pipeline
      cogs are AWS Lambda functions behind their own SQS queue (ADR-009); trigger
      cogs are Lambda functions on an EventBridge schedule (ADR-011); wiki-curator-cog
      and db-ops run as one-shot Railway processes. The canonical service type for
      all automation, processing, and evaluation work in the ecosystem.

      '
    examples:
    - "watcher-cog \u2014 Drive folder watcher, asks the API to enqueue runs"
    - "deejay-cog \u2014 DJ set CSV processor and ingestion"
    - "evaluator-cog \u2014 on-demand conformance evaluation"
    subtypes:
      pipeline_cog: 'A Lambda worker that processes one job per queue message. Examples:
        deejay-cog, evaluator-cog.

        '
      trigger_cog: 'Detects events and asks api-kaianolevine-com to run the owning cog,
        which enqueues; never writes to a queue itself (PIPE-019). Examples: watcher-cog.

        '
  pipeline:
    definition: "The flow logic a cog runs for one job. A cog runs a pipeline.\
      \ The terms are related but distinct \u2014 the cog is the service, the pipeline\
      \ is the execution logic within it.\n"
  trigger:
    definition: 'The mechanism that causes a pipeline run: a job api-kaianolevine-com
      enqueues onto the cog''s queue, asked for by watcher-cog (Drive events), by a
      release job''s evaluate request (conformance), or by an operator. GitHub Actions
      is not a trigger mechanism beyond that evaluate request (CD-006).

      '
