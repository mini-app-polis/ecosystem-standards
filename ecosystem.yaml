services:
- id: watcher-cog
  type: trigger-cog
  status: active
  dod_type: new_cog
  language: python
  cog_subtype: trigger
  host: railway
  description: 'Config-driven Google Drive folder watcher. Polls Drive API on a 1-minute
    interval and asks api-kaianolevine-com to run the cog that owns a folder when
    files change — once per folder for deejay-cog, once per changed file for
    transcription-cog. The API enqueues; watcher holds no queue key.

    '
- id: deejay-cog
  type: pipeline-cog
  status: active
  dod_type: new_cog
  language: python
  cog_subtype: pipeline
  host: aws-lambda
  description: 'DJ set CSV processor. Normalizes, validates, and ingests DJ set data
    into PostgreSQL via api-kaianolevine-com.

    '
- id: evaluator-cog
  type: pipeline-cog
  status: active
  dod_type: new_cog
  language: python
  cog_subtype: pipeline
  host: aws-lambda
  description: 'Multi-mode AI evaluation cog. Runs post-pipeline behavioral evaluation
    (pipeline_eval, called in-process by other cogs) and structural conformance
    checking on demand — POST /invoke for one repository when it releases, POST /sweep
    for the whole registry when the standards catalog or the evaluator releases. No
    schedule and no Prefect deployment (ADR-0004). Reads the compiled rule catalog
    from the API rather than checking out ecosystem-standards. All findings written to pipeline_evaluations table via api-kaianolevine-com
    with source field distinguishing evaluation type.

    '
- id: transcription-cog
  type: pipeline-cog
  status: active
  dod_type: new_cog
  language: python
  cog_subtype: pipeline
  host: aws-lambda
  description: 'Two pipelines in one Lambda function behind its own SQS queue
    (transcription-jobs). watcher-cog asks api-kaianolevine-com for one run per
    changed Drive file, and one message is one file (ADR-007):

    * mode "wcs-transcripts" — a WCS lesson transcript from the notes input
    folder: an LLM extracts structured notes, raw transcript and extraction are
    stored through api-kaianolevine-com (wcs_transcripts, wcs_sources), and the
    file is archived. Consumed by wcs.kaianolevine.com.

    * mode "voicenotes" — a voice note from voice-inbox/: Whisper transcribes,
    Claude extracts a task, post_task creates it on the Asana board with the
    Drive file id as its external id for idempotency, the audio is archived to
    processed/YYYY-MM-DD/, and the retention sweep runs.

    * mode "voicenotes-cleanup" — the retention sweep on its own, for an
    operator; names no file.

    Both pipelines report under the transcription-cog repo identifier, told
    apart by flow_name (process-transcript, voicenotes-ingest). Merged from
    notes-ingest-cog and voicenotes-cog in May 2026 (ADR-004); those
    identifiers are retired.

    '
- id: wiki-curator-cog
  type: pipeline-cog
  status: development
  dod_type: new_cog
  language: python
  cog_subtype: pipeline
  host: railway
  description: 'Reads structured WCS notes from api-kaianolevine-com and maintains
    the wcs-wiki markdown knowledge base.

    The last cog still on Prefect and Railway, and it is paused: nothing triggers
    it, and it is not run again before it moves to a Lambda behind its own queue
    like the other three (ADR-009). Until then it fails the pipeline-cog rules
    that describe that runtime — PIPE-016 and PIPE-017 — and those findings are
    the list of what the move involves rather than drift to fix in place.

    Registered here because it already carries an evaluator.yaml declaring itself
    conformance-managed (type: pipeline-cog) — before that the fleet-wide run
    never enumerated it, so it declared itself graded and was graded by nothing.

    '
- id: api-kaianolevine-com
  type: api-service
  status: active
  dod_type: new_fastapi_service
  language: python
  framework: fastapi
  host: railway
  description: 'Primary ecosystem API. DJ sets, tracks, catalog, evaluations, feature
    flags, contact form, resume endpoints. Sole API for the kaianolevine.com ecosystem.

    '
- id: identity
  type: shared-library
  status: active
  dod_type: null
  language: python
  package: miniapppolis-identity
  description: "The cross-ecosystem identity and authorization contract. Defines one\
    \ binding \u2014 verify, resolve, authorize, emit_audit \u2014 plus the principal\
    \ store schema, the scope vocabulary, the decision function, and cross-language\
    \ conformance fixtures. Consumed by each enforcement point rather than run as\
    \ a service: one specification, N conformant enforcement points, deliberately\
    \ not a central auth service on the request path. Verifies Clerk session JWTs\
    \ for humans and named per-machine API keys for cogs. See ADR-008, CD-019, AUTH-004.\n"
- id: common-python-utils
  type: shared-library
  status: active
  dod_type: null
  language: python
  package: miniapppolis-common-utils
  description: "Shared Python utilities. Google API client (Drive, Sheets), LLM client\
    \ (Anthropic, OpenAI), structured logging, metadata helpers, and KaianoApiClient\
    \ \u2014 the ecosystem API client, which resolves the caller's own named machine\
    \ key from the environment and sets the Authorization header (CD-019, AUTH-002).\
    \ All Python processors and cogs declare this as a dependency.\n"
- id: common-typescript-utils
  type: shared-library
  status: active
  dod_type: null
  language: typescript
  repo: common-typescript-utils
  package: common-typescript-utils
  description: 'Shared TypeScript utilities. Clerk auth middleware (verifyClerkToken),
    response envelope helpers (success, successList, error, CommonErrors), structured
    logger (createLogger) emitting standard log shape, and shared Zod schemas. Published
    to npm as common-typescript-utils.

    '
- id: ecosystem-standards
  type: standards-repo
  status: active
  dod_type: null
  language: yaml
  host: github
  description: 'Machine-readable ecosystem standards. Single source of truth for all
    architectural decisions, patterns, and conventions. Versioned YAML files consumed
    by evaluator-cog at runtime. Semantic-release owns versioning via index.yaml.

    '
- id: .github
  type: shared-workflows
  status: active
  dod_type: null
  language: yaml
  host: github
  description: "The org-wide GitHub configuration repo. Holds the fleet's shared security\
    \ workflow (.github/workflows/security.yml), a reusable workflow that runs secret\
    \ scanning, a dependency audit, static analysis and SBOM generation. SEC-002 through\
    \ SEC-005 accept a job delegating to it in place of inline steps; registering\
    \ it here is what makes that honest, because the steps are then evaluated once\
    \ rather than being invisible in every consumer. Consumers pin the moving `v1`\
    \ tag; a breaking change gets `v2` instead. No release automation \u2014 CHANGELOG.md\
    \ is maintained by hand.\n"
- id: deejaytools-com-api
  type: api-service
  status: active
  dod_type: new_hono_service
  language: typescript
  framework: hono
  host: railway
  repo: deejaytools-com
  monorepo: deejaytools-com
  monorepo_path: apps/api
  description: 'Hono on Node API for deejaytools.com. Manages WCS routine registration,
    floor trial sessions, check-ins, slot assignment, partners, and songs. PostgreSQL
    on Railway. Clerk auth. Part of the deejaytools-com monorepo.

    '
- id: deejaytools-com-app
  type: react-app
  status: active
  dod_type: new_react_app
  language: typescript
  framework: react
  host: cloudflare-pages
  repo: deejaytools-com
  monorepo: deejaytools-com
  monorepo_path: apps/app
  description: "React web application for deejaytools.com. WCS routine management\
    \ platform \u2014 events, sessions, floor trials, check-in queue, partner and\
    \ song management. Vite + React + Tailwind + shadcn/ui. Part of the deejaytools-com\
    \ monorepo.\n"
- id: website-astro-software
  type: static-site
  status: active
  dod_type: new_frontend_site
  language: astro
  host: cloudflare-pages
  description: "Software portfolio site. Queries api-kaianolevine-com live for DJ\
    \ sets, catalog, stats, and evaluation findings. Hosts the feature flag admin\
    \ panel at /admin (Clerk-authenticated, admin role required) \u2014 the canonical\
    \ management surface for toggling flags across the ecosystem.\n"
- id: website-astro-wcs
  type: static-site
  status: active
  dod_type: new_frontend_site
  language: astro
  host: cloudflare-pages
  description: West Coast Swing personal site. wcs.kaianolevine.com.
- id: website-astro-wcsmn
  type: static-site
  status: active
  dod_type: new_frontend_site
  language: astro
  host: cloudflare-pages
  description: "West Coast Swing community resource for Minnesota \u2014 events and\
    \ organizations. wcsmn.com. Read-only: the site never authenticates or writes,\
    \ and the homepage calendar reads the Google Calendar API from the browser.\n"
- id: kwalla-dance
  type: static-site
  status: active
  dod_type: new_frontend_site
  language: astro
  host: cloudflare-pages
  description: "Personal site for Kristen Wallace (WCS instructor), kristenwallace.com.\
    \ Freelance build. Events are baked in at build time from a public iCloud feed,\
    \ so a scheduled workflow pings the Cloudflare Pages deploy hook twice daily to\
    \ pick up new events without her touching anything.\n"
monorepos:
- id: deejaytools-com
  repo: deejaytools-com
  branch: dev
  package_manager: pnpm
  workspace_config: pnpm-workspace.yaml
  description: 'pnpm monorepo containing the deejaytools.com API and web application.
    Workspace-level deps satisfy per-app shared library requirements (XSTACK-001,
    XSTACK-003). CI is evaluated at the repo root.

    '
  apps:
  - service_id: deejaytools-com-api
    path: apps/api
  - service_id: deejaytools-com-app
    path: apps/app
  workspace_deps: []
  evaluator:
    strategy: per_app
    workspace_context: true
    deduplicate_sibling_findings: true
patterns:
  drive_trigger:
    description: How Drive file drops trigger processor flows
    current: "watcher-cog polls Drive API \u2192 fires Prefect create_flow_run"
  orchestration:
    description: How pipelines are scheduled and executed
    current: "Prefect Cloud deployments \u2014 watcher-cog fires triggers, Prefect\
      \ executes flows"
  python_shared_library:
    description: Shared Python utility library name
    current: common-python-utils
  typescript_shared_library:
    description: Shared TypeScript utility library name
    current: common-typescript-utils
  api_services:
    description: Active API services
    current: api-kaianolevine-com (sole API for kaianolevine.com ecosystem)
  auth:
    description: How callers authenticate to ecosystem APIs
    current: "Single Authorization: Bearer header. Humans present Clerk session JWTs,\
      \ verified locally against JWKS. Machines present a named per-machine API key\
      \ held only in Doppler as <MACHINE_NAME>_API_KEY, verified locally by constant-time\
      \ comparison \u2014 the key is the identity claim. Both paths run through the\
      \ identity library.\n"
  authorization:
    description: How access is granted once a caller is identified
    current: 'Roles are named bundles of scopes; a scope is <domain>.<resource>.<action>.
      Every non-public route names the one scope it requires. Machine principals and
      their roles are declared in code and reconciled into the principal store at
      boot.

      '
terminology:
  cog:
    definition: 'An always-on Python worker service deployed on Railway. Runs a continuous
      loop or event-driven task. No HTTP server, no port binding. The canonical service
      type for all automation, processing, and evaluation work in the ecosystem.

      '
    examples:
    - "watcher-cog \u2014 Drive folder watcher, fires Prefect flow runs"
    - "deejay-cog \u2014 DJ set CSV processor and ingestion"
    - "evaluator-cog \u2014 post-pipeline AI evaluation"
    subtypes:
      pipeline_cog: 'Runs a Prefect @flow to process data. Examples: deejay-cog, evaluator-cog.

        '
      trigger_cog: 'Detects events and fires Prefect flow runs via API. No @flow decorator.
        Examples: watcher-cog.

        '
  pipeline:
    definition: "The Prefect flow and task logic inside a cog. A cog runs a pipeline.\
      \ The terms are related but distinct \u2014 the cog is the service, the pipeline\
      \ is the execution logic within it.\n"
  trigger:
    definition: 'The mechanism that causes a Prefect flow run to be created. Triggers
      are fired by watcher-cog (Drive events), Prefect schedules (time-based), or
      the Prefect UI/API (manual). GitHub Actions is not a trigger mechanism.

      '
