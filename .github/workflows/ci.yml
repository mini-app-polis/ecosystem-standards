name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over full
  # history, an osv-scanner dependency audit, and semgrep. Pinned at @v2
  # rather than @v1 because this repo carries a package.json (for
  # semantic-release) with no committed lockfile — v1's `npm ci` fails on
  # that, and v2's osv-scanner path treats it as "no Node dependencies
  # declared" and skips, which is the truthful answer.
  #
  # sbom: false and no gitleaks pre-commit hook — SEC-005 and SEC-001 do
  # not list standards-repo in their applies_to.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v2
    with:
      language: typescript
      package-manager: npm
      sbom: false

  test:
    name: Validate and compile catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # Enforces the META rules, the canonical enums read from index.yaml
      # and definitions-of-done.yaml, and the structural integrity of the
      # rule catalog. Previously an inline heredoc here; now a script, so
      # it can be run by hand before pushing.
      - name: Validate standards catalog and META rules
        run: python3 scripts/validate_catalog.py

      # Proves the catalog compiles on every push. The artifact is not
      # committed and not published here — only the release job on main
      # publishes, because package.json has no meaningful version until
      # semantic-release cuts one.
      - name: Compile standards catalog
        run: python3 scripts/compile_catalog.py

  release:
    name: Release
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/npm \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # After semantic-release, so the working tree holds the package.json it
      # just bumped and the catalog compiles with the version being released.
      # A run with no releasable commits publishes the version that is already
      # stored, which the API accepts as a no-op — immutability makes the
      # redundant post harmless rather than needing a condition here.
      #
      # The URL is a variable rather than a secret: it is the public address
      # of a public API, and a secret would only make it harder to see which
      # environment a run published to. Production only — dev reads the
      # catalog from production, since rule text is not environment-specific.
      - name: Publish standards catalog
        env:
          KAIANO_API_BASE_URL: ${{ vars.KAIANO_API_BASE_URL }}
          ECOSYSTEM_STANDARDS_API_KEY: ${{ secrets.ECOSYSTEM_STANDARDS_API_KEY }}
        run: python3 scripts/publish_catalog.py
