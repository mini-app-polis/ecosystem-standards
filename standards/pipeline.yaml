# ecosystem-standards / pipeline.yaml
# Standards for pipeline design and orchestration.

standards:

  # ─────────────────────────────────────────────
  # ORCHESTRATION STACK
  # ─────────────────────────────────────────────

  # ─────────────────────────────────────────────
  # PIPELINE DESIGN
  # ─────────────────────────────────────────────

  - id: PIPE-002
    title: Database writes use upsert patterns
    status: requirement
    dimension: pipeline_consistency
    severity: ERROR
    applies_to: [pipeline-cog, trigger-cog]
    description: >
      Database writes in pipeline steps use upsert patterns —
      on_conflict_do_update, merge, or equivalent — rather than plain
      inserts. This is the concrete, mechanically-checkable portion of
      pipeline idempotency. The broader "is the whole flow idempotent"
      concern lives in PIPE-013.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Scan all flow and task source files (src/**/*.py) for database
      write operations:
        (1) `session.add(...)`, `session.add_all(...)` — flag unless
            immediately preceded or followed by an on_conflict_do_update
            call on the target table, OR the target table is explicitly
            declared as append-only (documented in a comment or in
            ecosystem.yaml).
        (2) Raw `session.execute(INSERT INTO ...)` — flag if the INSERT
            lacks ON CONFLICT DO UPDATE or ON CONFLICT DO NOTHING.
        (3) HTTP `POST` or `PATCH` calls to api-kaianolevine-com
            endpoints that are known idempotency-sensitive
            (/v1/evaluations, /v1/live-plays, /v1/wcs_notes) —
            flag any POST without an Idempotency-Key header or
            equivalent dedup identifier.
      Exempt: test files, migration scripts, one-shot backfill scripts
      with names matching migrate_*.py or backfill_*.py.
      Expected remediation: use on_conflict_do_update targeting a stable
      unique key (source file ID, content hash, or composite of
      run_id + repo).

  - id: PIPE-003
    title: Separate process and collect steps
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog]
    description: >
      Processing new inputs and rebuilding the collection are separate pipeline
      steps — not combined. Allows independent retry.
    checkable: true
    check_notes: >
      LLM CHECK.
      For each function in src/**/*.py that a worker mode calls once per
      input item, assess whether its body performs BOTH of the
      following within one function:
        (a) Processing of a single, discrete input item — e.g. a single
            file, row, or record passed as an argument and transformed
            in place.
        (b) Rebuilding or recomputing an aggregate structure — e.g.
            regenerating a collection file, rewriting a summary sheet,
            or producing an output that derives from ALL items rather
            than from the one passed in.
      Flag the task as violating PIPE-003 when both patterns coexist
      in the same function body. The signal for (b) is: iterating over
      a full input listing (glob, list_directory, full-table SELECT) in
      a task whose declared purpose is per-item processing.
      Remediation: split into two `@task` functions — one parameterized
      on the single item, one parameterized on the full collection —
      and invoke them as separate flow steps. This rule is LLM-judged
      because the distinction between "touching multiple related
      records" (legitimate) and "rebuilding the collection" (violation)
      requires reading intent, not just matching patterns.

  - id: PIPE-005
    title: Raw inputs are archived, not deleted
    status: requirement
    dimension: structural_conformance
    severity: ERROR
    applies_to: [pipeline-cog, trigger-cog]
    description: >
      Raw inputs are archived after processing, never deleted. This
      rule covers the concrete delete-vs-archive check. The broader
      "is archiving applied consistently across all input types" check
      lives in PIPE-014.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Scan all Python source files for input-deletion patterns on the
      Drive API and filesystem:
        (1) `drive_service.files().delete(fileId=...)` — flag any call.
        (2) `drive_service.files().update(fileId=..., body={'trashed': True})` —
            flag any call.
        (3) `os.remove(...)`, `os.unlink(...)`, `pathlib.Path.unlink()`
            on paths derived from input-file variables (names
            containing `input`, `source`, `raw`, or matching the flow's
            configured input folder pattern) — flag.
        (4) `shutil.rmtree(...)` targeting any directory that matches
            input-folder naming — flag.
      Exempt: test fixtures, build artifacts in `dist/` or `build/`,
      tempfile cleanup with explicit `tempfile` or `tmp_path` context.

  - id: PIPE-007
    title: Retry logic on external API calls
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog]
    description: >
      A call to an external API is retried at the call site when it fails
      transiently. Any of these counts: a common-python-utils client that
      retries internally (DriveFacade, the Sheets helpers, LLMClient,
      KaianoApiClient), a client library's own retry (spotipy, the AWS
      SDK), tenacity, or a hand-written attempt loop.

      Queue redelivery is not the retry. On a queue-driven pipeline cog a
      failed message comes back after the visibility timeout and runs
      from the top, and after max_receive_count attempts it goes to the
      dead-letter queue (PIPE-017). That is the backstop for a job that
      cannot succeed, not the answer to one 503: it repeats every step
      the job already did, waits minutes rather than seconds, and spends
      an attempt the job may need later.

      A call whose failure does not matter — a heartbeat ping, a
      best-effort notification — needs no retry, and says so with a
      `# no-retry: <reason>` comment in the function.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Parse every Python module under src/. For each function that calls
      httpx or requests directly (httpx.get/post/put/patch/delete/request,
      httpx.Client, httpx.AsyncClient, requests.<verb>, requests.Session),
      the call is covered when any of these holds: the function is
      decorated with a retry decorator (a decorator named `retry`, as
      tenacity's is); the call sits inside a for or while loop in that
      function; or the function body carries a `# no-retry:` comment.
      Flag each uncovered function, naming module and function. Calls
      through common-python-utils clients and SDKs are not direct calls
      and are not examined.
      Previously this looked for Prefect @task(retries=) decorators;
      Prefect is retired (ADR-009).

  - id: PIPE-008
    title: Retired trigger patterns are not used
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog]
    description: >
      Pipeline cogs do not contain any of the retired trigger patterns
      (repository_dispatch relays, workflow_dispatch from application
      code, direct GitHub API calls to trigger workflows,
      google-app-script-trigger references). These were replaced by
      watcher-cog → api-kaianolevine-com → the cog's queue. The broader "does this
      cog's trigger architecture match the canonical pattern" check
      lives in PIPE-015.
    supersedes: "Apps Script → repository_dispatch → GitHub Actions (retired 2026-03)"
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      The canonical production trigger path in MiniAppPolis is:
      watcher-cog detects a source-of-truth change → asks
      api-kaianolevine-com to run the cog → the API enqueues onto the
      cog's queue → the cog's Lambda runs. GitHub Actions
      should not be a relay for production flow triggers.

      Flag a workflow if ALL of the following are true:
        (1) It uses `on: repository_dispatch:` or a similar event-driven
            trigger (NOT `on: workflow_dispatch:` which is manual).
        (2) It invokes application code directly — e.g.
            `uv run python -u src/<cog>/<module>.py`, `pnpm run <script>`
            executing app logic, or a custom action that runs a flow.
        (3) The same functionality exists, or should exist, as queued
            work the cog's Lambda runs. The giveaway is a worker mode
            whose work is duplicated or shadowed by the workflow.

      DO NOT flag a workflow in any of these cases:
        - It uses `on: workflow_dispatch:` (manual-only). Manual triggers
          for debugging, one-off runs, or convenience are legitimate.
        - It handles deprecated or archival functionality that has been
          intentionally kept off the queue (e.g. rarely-run local or
          archival operations). Look
          for a comment in the workflow, a note in the README, or a
          retired/deprecated marker. If the repo's docs indicate the
          functionality is legacy, the workflow is not drift.
        - It is pure CI/CD — running tests, linting, building, deploying.
          Those are not application-code triggers.
        - It asks api-kaianolevine-com to enqueue the work rather than
          invoking app code directly. That IS the canonical path — it's
          just initiated from GitHub instead of watcher-cog, which is a
          different question (CD-006, and out of scope for PIPE-008).

      When flagging, cite the specific workflow file(s) and name the
      queued mode or watcher-cog path that should be the canonical
      trigger instead. If the canonical path does not yet exist, say so
      — that changes the remediation from "remove the workflow" to
      "consolidate onto the canonical path."

      COG SUBTYPE: This rule applies to pipeline cogs only. Skip for
      trigger cogs and watcher-cog itself.

  - id: PIPE-011
    title: AI evaluation step as final pipeline task
    status: requirement
    dimension: pipeline_consistency
    severity: WARN
    applies_to: [pipeline-cog]
    description: >
      All production pipeline cogs include a behavioral evaluation step as the
      final task in the flow. The step calls evaluate_pipeline_run() from
      evaluator-cog, summarising what the run did (items processed, failures,
      skips) and posts a structured finding to pipeline_evaluations. This ensures
      every run — successful or not — is visible in pipeline health. Crash and
      failure hooks (on_crashed, on_failure) are separate and complementary —
      they cover the case where the flow body never reaches the evaluation step.
      Both patterns must be present: the inline evaluation step for successful
      runs, and the crash/failure hooks for abnormal termination.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Search the main flow file for a final @task call that references
      evaluation, pipeline_eval, or writes to pipeline_evaluations. Check
      for imports of the evaluation client from common-python-utils or direct
      POST to /v1/evaluations. Flag if no evaluation task is found as the
      last substantive task in the flow. Exempt evaluator-cog itself.

      COG SUBTYPE: This rule applies to pipeline cogs (cog_subtype: pipeline)
      only. Do not flag trigger cogs (cog_subtype: trigger) — they fire flow
      runs but do not run pipelines themselves and have no evaluation step.
      Skip this check for any cog with cog_subtype: trigger.

  - id: PIPE-013
    title: Flow design is idempotent end-to-end
    status: requirement
    dimension: pipeline_consistency
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog]
    description: >
      Beyond database writes (PIPE-002), the overall flow design must
      produce the same result when re-run. This covers: file moves that
      depend on current state, stateful counters, external side effects
      that are not guarded by a deduplication key, and flow-level
      retry semantics.
    checkable: true
    check_notes: >
      LLM CHECK.
      Assess the flow structure for the following anti-patterns, each
      of which produces a distinct finding:
        (1) File archive/move operations that assume the file has not
            been processed before. An archive step that moves file X to
            archive/ fails on re-run because X no longer exists at the
            source. Flag flows that move files without first checking
            whether the file was already processed.
        (2) Stateful counters incremented per run rather than derived
            from idempotent state. A counter that goes up on every run
            regardless of work done produces wrong values on retry.
        (3) External side effects (sending emails, posting to Slack,
            creating calendar events) triggered per-run without a
            deduplication guard keyed on run_id or input hash.
        (4) Flow-level retry configuration that re-runs the whole flow
            on failure. If the flow is not idempotent end-to-end, this
            amplifies bad behavior rather than recovering from it.
      For each anti-pattern detected, emit a finding citing PIPE-013
      with the specific file and line. Remediation is always "add a
      dedup key or a state check before the side effect."

  - id: PIPE-014
    title: Archiving pattern is consistent across all input types
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog]
    description: >
      For pipeline cogs that handle multiple input types (e.g. Drive
      files + API submissions + scheduled batches), the archiving
      behavior must be consistent across all of them. One input type
      being archived to `processed/` while another is silently
      retained in the source folder creates operational confusion.
    checkable: true
    check_notes: >
      LLM CHECK.
      Identify every input source handled by the cog. For each source,
      determine whether a post-processing archive step exists and
      where archived items land. Flag if:
        (1) Some input types are archived and others are not.
        (2) Archive destinations are inconsistent across input types
            (one goes to `processed/`, another to `archive/`, a third
            has no destination).
        (3) The archive destination is documented nowhere (not in
            README, not in the flow code's docstring, not in
            ecosystem.yaml).
      This rule is LLM-judged because it requires understanding what
      counts as an "input type" and tracing post-processing behavior,
      which is not mechanically detectable. Remediation: pick one
      archive convention per cog, apply it to every input type, and
      document it in the cog README.

  - id: PIPE-015
    title: Cog trigger architecture matches the canonical pattern
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog]
    description: >
      The canonical Drive-event trigger pattern is:
        File appears in watched Drive folder
        → watcher-cog detects the change (1-minute poll via Drive API)
        → watcher-cog asks api-kaianolevine-com to run the cog
        → the API enqueues one message onto the cog's queue
        → the cog's Lambda runs it.
      This rule checks whether a cog's overall trigger architecture
      conforms to the pattern — not just whether it avoids retired
      patterns (PIPE-008). The two checks fail for different reasons
      and require different fixes.
    checkable: true
    check_notes: >
      LLM CHECK.
      Examine the cog's entry point(s) and determine how flow runs
      are initiated. Flag if:
        (1) The cog polls for input changes itself (duplicates
            watcher-cog's responsibility).
        (2) The cog's work is invoked directly by cron or by a
            scheduled command, rather than via its queue.
        (3) The cog uses watcher-cog but the WatcherConfig entry
            for its input folder is missing from watcher-cog's
            config — this creates a cog that expects to be triggered
            but has no trigger configured.
        (4) The cog receives triggers from a source other than its
            queue, which only the API sends to (e.g. direct HTTP calls
            from a frontend, a webhook from a third party).
            These may be legitimate patterns for specific cog types
            — flag for review rather than as an automatic violation.
      This is LLM-judged because the "what's your trigger source"
      question requires tracing from the worker outward to its
      queue, the API route that enqueues onto it, watcher-cog config,
      and ecosystem.yaml service wiring.

      COG SUBTYPE: Skip for trigger cogs and watcher-cog itself.

  # ─────────────────────────────────────────────
  # RUNTIME — QUEUE AND LAMBDA
  # ─────────────────────────────────────────────

  - id: PIPE-016
    title: Pipeline cogs run on Lambda behind their own queue
    status: requirement
    dimension: structural_conformance
    severity: ERROR
    applies_to: [pipeline-cog]
    supersedes: >
      PIPE-001 (Prefect for new pipelines), CD-005 (Prefect Cloud for
      pipeline observability), CD-015 (Prefect serve() — no work pool) and
      CD-016 (serve() wrapped in serve_with_retry), all retired 2026-09 per
      ADR-009. They required a resident Railway container polling Prefect
      Cloud; the fleet's pipeline cogs now hold no resident process.
    description: >
      A pipeline cog is an AWS Lambda function fed by an SQS queue of its
      own, and its repository owns that infrastructure: `infra/` declares
      the queue, the function and the event source mapping between them.
      AWS polls the queue and invokes the function, so nothing of the
      cog's stays running between jobs.

      One queue per cog, because SQS has no selective receive: on a shared
      queue each consumer would take, fail to recognise and dead-letter
      the others' work. The API is the only producer (CD-006), and derives
      the queue name from the cog's name and its own environment.

      Prefect is not a dependency. A cog that still declares it has not
      finished moving, whatever else it runs on.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) Read `infra/*.tf`. Fail if it does not declare all three of
          `resource "aws_sqs_queue"`, `resource "aws_lambda_function"`
          and `resource "aws_lambda_event_source_mapping"`. Name the ones
          missing; a repo with no `infra/` fails on all three.
      (2) Fail if `prefect` is declared in pyproject.toml or
          requirements.txt.
    origin: >
      2026-09: evaluator-cog and deejay-cog moved from Prefect on Railway
      to SQS and Lambda (evaluator-cog docs/serverless-migration.md), and
      the rules still describing the old runtime graded both as drifted.

  - id: PIPE-017
    title: A failed job is handed back, retried and dead-lettered
    status: requirement
    dimension: pipeline_reliability
    severity: ERROR
    applies_to: [pipeline-cog]
    supersedes: >
      CD-017 (version-controlled Railway restart policy) for pipeline cogs,
      which no longer have a process to restart. The queue's redelivery is
      their retry policy.
    description: >
      Nothing is deleted from the queue until its work is done. The event
      source mapping deletes every record the handler does not name, so
      the handler reports failures per record — `ReportBatchItemFailures`
      on the mapping, a `batchItemFailures` list from the handler — rather
      than raising, which would redeliver a whole batch for one bad record.

      A record that keeps failing must end somewhere a person can see it:
      the queue has a redrive policy to a dead-letter queue. Without one a
      poison message retries forever.

      The queue's visibility timeout is longer than the function's
      timeout. Shorter, and SQS redelivers a job while the first attempt
      is still running, so the same work runs twice.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) In `infra/*.tf`, fail unless the `aws_lambda_event_source_mapping`
          sets `function_response_types` including "ReportBatchItemFailures".
      (2) Fail unless an `aws_sqs_queue` sets a `redrive_policy` naming a
          `deadLetterTargetArn`.
      (3) Fail unless the queue's `visibility_timeout_seconds` is derived
          from the function's timeout (references the same variable) or,
          when both are literals, exceeds it.
      (4) Fail if no production source file under src/ returns a
          `batchItemFailures` value.
    origin: >
      evaluator-cog's migration: a stub Lambda that returned success ate
      five real evaluations, and the delete-on-success rule is what the
      queue was introduced for.

  - id: PIPE-018
    title: Pipeline cogs declare their concurrency
    status: requirement
    dimension: pipeline_reliability
    severity: WARN
    applies_to: [pipeline-cog]
    supersedes: >
      PIPE-004 (Prefect concurrency groups for shared resources) and
      PIPE-009 (named Prefect concurrency slot before scanning a shared
      resource), retired 2026-09 per ADR-009.
    description: >
      How many jobs may run at once is stated in `infra/`, not left to the
      account's pool. Lambda will otherwise scale a burst out as wide as
      the account allows, and every one of those workers writes to the
      same API, the same Drive folders and the same Sheets.

      The ceiling is `scaling_config.maximum_concurrency` on the event
      source mapping (at least 2 — AWS's floor), or
      `reserved_concurrent_executions` on the function, which is the only
      way to get 1. A cog whose job sweeps a shared resource — two
      concurrent runs would process the same items — needs 1, and says so.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      In `infra/*.tf`, fail unless the `aws_lambda_event_source_mapping`
      has a `scaling_config` block setting `maximum_concurrency`, or the
      `aws_lambda_function` sets `reserved_concurrent_executions`.
    origin: >
      The Prefect limits these replace were set in code; deejay-cog's sweep
      needs one run at a time and the mapping cannot go below two.

  - id: PIPE-019
    title: Trigger cogs start work through the API
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [trigger-cog]
    supersedes: >
      PIPE-001's trigger-cog half, which required the Prefect client, and
      was retired 2026-09 per ADR-009.
    description: >
      A trigger cog detects that there is work and asks
      api-kaianolevine-com to run it; the API enqueues onto the owning
      cog's queue. It does not create Prefect flow runs, and it does not
      hold a key that can write to a queue.

      Its triggers are gated to production. A development trigger cog
      watches the same sources production does, so anything it fires is a
      second trigger for production's work.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) Fail if `prefect` is declared in pyproject.toml or
          requirements.txt, or production source references
          `create_flow_run`, `run_deployment` or `get_client(` from Prefect.
      (2) Fail if production source calls boto3's SQS `send_message`.
    origin: >
      watcher-cog's deejay trigger moved to POST /v1/deejay/runs in 2026-09,
      and its transcription triggers followed a week later, one request per
      changed file. Nothing it fires reaches Prefect any more.

