# ecosystem-standards / testing.yaml
# Testing standards for all Python cogs and FastAPI services.
#
# GAP: Most existing cogs currently have import-level tests only.
# Per-repo remediation sequencing lives in BACKLOG.md — see TEST-GAP-001.

standards:

  - id: TEST-000
    title: Testing pyramid — right ratio, not maximum coverage
    status: convention
    dimension: testing_coverage
    severity: INFO
    applies_to: [all]
    description: >
      The goal is the right ratio of test types, not maximum line coverage.
      Unit tests (many): pure functions in isolation, no I/O, no external calls. Fast.
      Integration tests (some): the repo through its real entry point — for
        an api-service against the production database engine, for a cog
        with external dependencies stubbed. One per major external integration.
      Contract tests (few): a consumer's expectations checked against the
        deployed dev instance of the API it calls.
      E2E tests (few): happy path only, against the deployed dev
        environment, run after each dev deploy.
      Which layers a repo must have is TEST-014 to TEST-017 (ADR-012).
    checkable: false

  # ─────────────────────────────────────────────
  # CRITICAL PATH — PYTHON COGS
  # Four tests required per cog. Not 100% line coverage —
  # these four specific paths.
  # ─────────────────────────────────────────────

  - id: TEST-001
    title: Normalization test required per cog
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service]
    description: >
      A test that verifies the normalization/cleaning logic on representative input.
      Covers the core transformation the cog exists to do.
    checkable: true
    check_notes: >
      LLM CHECK.
      Scan all files under tests/**/*.py and identify test functions
      (functions whose name starts with `test_`). Pass if at least one
      test function satisfies BOTH:
        (a) Its name or docstring references normalization, cleaning,
            transformation, parsing, or the cog's core transform verb
            (e.g. `test_normalize_*`, `test_clean_*`, `test_parse_*`,
            `test_transform_*`).
        (b) Its body passes a representative input to the cog's
            normalization entry point (a function exported from
            src/**/*.py that performs the transform) and asserts the
            returned value equals or contains a normalized expected
            value — i.e. the assertion is about the SHAPE or CONTENT
            of the transform's output, not just that it did not raise.
      Flag the repo if no test function meets both (a) and (b).
      This is LLM-judged because the cog's "core transformation" is
      not mechanically derivable from the repo alone — it requires
      reading the cog's purpose (ecosystem.yaml description + README)
      to know what to look for in tests.

  - id: TEST-002
    title: Deduplication test required per cog
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service]
    description: >
      A test that verifies duplicate inputs are correctly identified and handled —
      not silently overwritten.
    checkable: true
    check_notes: >
      LLM CHECK.
      Scan tests/**/*.py for test functions satisfying BOTH:
        (a) Name or docstring references duplicates, deduplication,
            duplicate detection, or overwrite prevention (common
            patterns: `test_duplicate_*`, `test_dedup_*`,
            `test_no_overwrite_*`, `test_possible_duplicate_*`).
        (b) Body passes the same input twice (or two inputs with
            identical canonical content) to the cog and asserts the
            second invocation produced a dedup outcome appropriate
            to the cog's chosen strategy (see PY-013) — e.g. a
            file rename with `possible_duplicate_` prefix, a
            skip/no-op return value, an `on_conflict_do_nothing`
            DB outcome, an assertion that the original was not
            overwritten, or a uniqueness-constraint `IntegrityError`
            that the cog handles by skipping.
      Flag the repo if no test function meets both (a) and (b).

  - id: TEST-003
    title: Failure path test required per cog
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service]
    description: >
      A test that verifies the cog handles a bad input correctly — logs the
      error, marks the file, and continues rather than aborting.
    checkable: true
    check_notes: >
      LLM CHECK.
      Scan tests/**/*.py for test functions satisfying ALL THREE:
        (a) Name or docstring references the failure path
            (e.g. `test_*_failure`, `test_*_invalid`, `test_*_malformed`,
            `test_*_error_handling`, `test_failed_prefix`).
        (b) Body passes a malformed, invalid, or incomplete input
            (e.g. missing required field, bad type, corrupted bytes)
            to the cog's entry point.
        (c) Asserts the cog did NOT raise to the caller — either the
            call completed and returned, OR it wrote a FAILED_ prefix
            (see PY-012), OR it logged an error and moved on. A test
            that uses `pytest.raises(...)` WITHOUT also asserting
            continuation (e.g. that subsequent items in a batch still
            processed) does not satisfy this rule — that pattern
            verifies the exception exists, not that the pipeline is
            resilient.
      Flag the repo if no test function meets all three.

  - id: TEST-004
    title: Output shape test required per cog
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service]
    description: >
      A test that verifies the output (JSON schema, DB row, or file structure)
      matches the expected contract.
    checkable: true
    check_notes: >
      LLM CHECK.
      Scan tests/**/*.py for test functions whose body contains at
      least one assertion about the SHAPE of the cog's output:
        - `assert <result>.keys() == {...}` or `assert set(<result>) == {...}`
          (dict shape).
        - `assert isinstance(<result>, SomeModel)` where SomeModel is
          a Pydantic model defined in src/ (typed output shape).
        - `assert <result> == expected_row` where expected_row matches
          a DB row dict (DB output shape).
        - Schema validation via `jsonschema.validate(...)` or
          `SomeModel.model_validate(<result>)`.
      Simple `assert result is not None` or `assert len(result) > 0`
      checks do NOT satisfy this — they verify existence, not shape.
      Flag the repo if no test function contains a shape assertion.

  # ─────────────────────────────────────────────
  # TOOLING
  # ─────────────────────────────────────────────

  - id: TEST-005
    title: pytest as test runner
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service]
    description: >
      pytest is the test runner for all Python projects. Configured in pyproject.toml.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check for [tool.pytest.ini_options] in pyproject.toml. Flag if repo uses
      unittest directly without pytest.

  - id: TEST-006
    title: pytest-cov for coverage in CI
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service]
    description: >
      Coverage measured on every CI run. Report in terminal. Threshold not enforced
      by number — enforced by critical path coverage (TEST-001 through TEST-004).
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check CI workflow for pytest --cov or pytest-cov invocation. A job that
      calls mini-app-polis/.github's python-test.yml satisfies this unless it
      passes `pytest-args` without --cov, since that workflow runs pytest with
      --cov=src by default. Flag if coverage is not measured in CI.

  - id: TEST-007
    title: respx/httpx for HTTP mocking — no real external calls
    status: requirement
    dimension: testing_coverage
    severity: ERROR
    applies_to: [pipeline-cog, trigger-cog, api-service]
    description: >
      respx/httpx used for mocking HTTP calls in integration tests. No real external
      calls to Drive, Sheets, or any external API in unit or integration tests.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check pyproject.toml dev dependencies for respx. Search test files for
      any use of requests.get, httpx.get, or similar real HTTP calls outside
      of a respx.mock context. Flag any test file importing httpx or requests
      without a corresponding respx mock. Also flag if respx is absent from
      dev dependencies entirely.

  # ─────────────────────────────────────────────
  # FASTAPI TESTING
  # ─────────────────────────────────────────────

  - id: TEST-008
    title: FastAPI TestClient for API tests
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [api-service]
    description: >
      FastAPI's TestClient via httpx used for all API endpoint tests.
      Tests run without a live server.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      For FastAPI services, search test files for 'from fastapi.testclient
      import TestClient' or 'from httpx import AsyncClient'. Flag any test
      function (def test_*) whose body contains a string literal matching
      /v1/ and does not reference a TestClient or AsyncClient fixture.

  - id: TEST-009
    title: Database fixtures — no production data in tests
    status: requirement
    dimension: testing_coverage
    severity: ERROR
    applies_to: [api-service]
    description: >
      Tests use a separate test database or in-memory SQLite with transaction
      rollback. Never run against the production database.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Search conftest.py for database fixture definitions. Require at least one
      of the following patterns in conftest.py: (a) DATABASE_URL override to a
      test-specific URL, (b) in-memory SQLite engine creation, (c) transaction
      rollback fixture with scope='function' or 'session'. Flag if none are
      present in a repo containing SQLAlchemy model definitions. Also flag any
      hardcoded production DATABASE_URL strings in test files.

  - id: TEST-010
    title: Contract test for every API endpoint
    status: requirement
    dimension: testing_coverage
    severity: ERROR
    applies_to: [api-service]
    description: >
      Every API endpoint has a dedicated test asserting the response envelope shape:
      { data, meta } on success, { error: { code, message } } on failure.
      One contract test per endpoint minimum. Contract tests run in CI on every push.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Count FastAPI route decorators. Count test functions asserting response shape.
      Flag if any endpoint has no corresponding contract test, or if contract tests
      are absent from CI workflow.

  - id: TEST-011
    title: Mock verification required
    status: requirement
    dimension: testing_coverage
    severity: ERROR
    applies_to: [pipeline-cog, trigger-cog, api-service]
    description: >
      Every mock in a test must be verified with assert_called() or assert_called_once().
      Tests that pass because a mock was never called are false positives.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Search all test files for MagicMock, AsyncMock, patch, and mock_object
      usage. For each mock assignment, confirm a corresponding assert_called(),
      assert_called_once(), assert_called_once_with(), or assert_called_with()
      exists in the same test function. Flag test functions that create mocks
      but have no assertion on the mock object.

  - id: TEST-012
    title: Every Python repo typechecks in CI, against a declared [tool.mypy]
    status: requirement
    dimension: cd_readiness
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      Every Python repo of these types declares [tool.mypy] in pyproject.toml
      (python_version at minimum) and runs mypy in CI — "uv run mypy src/" as a
      step, or as the `typecheck` input to python-test.yml, which skips its
      type-check step when the input is empty. Both halves are required: a
      config that CI never runs gives false assurance, and mypy run with no
      config pins nothing about what is checked, so the result moves with the
      runner's Python and mypy's defaults.
      The trigger is the repo type, not the presence of config. The rule used
      to apply only to a repo that declared [tool.mypy], which made it opt-in:
      a repo that configured nothing was invisible, and "deliberately untyped"
      could not be told from "never set up".
      A repo that deliberately does not typecheck declares a TEST-012
      exemption in evaluator.yaml, with the reason.
      Typing in progress: a repo working toward this declares a TEST-012
      deferral in evaluator.yaml with an `until:` date. The date is what keeps
      the state time-bounded — once it passes, the finding resurfaces at full
      severity — and it must not be later than the repo's first stable
      release.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      A repo with no pyproject.toml is not a Python repo and passes (applies_to
      includes shared-library, which TypeScript libraries are too). Otherwise
      read pyproject.toml for a [tool.mypy] table, parsed as TOML so a
      commented-out section does not count, and scan .github/workflows/ for a
      non-comment line invoking mypy. Three findings, each with its own
      suggestion: nothing typechecks the repo (no config and no CI step);
      config declared but not run in CI; run in CI with no config.
      Exemptions and deferrals are applied by the runner from evaluator.yaml
      before the check is called; the check does not read them.
    origin: >
      api-kaianolevine-com had no mypy CI step; common-python-utils did, and
      the standard aligned them. It was then gated on [tool.mypy], and four of
      the eight Python repos — api-kaianolevine-com among them — had never
      typechecked with nothing saying so. evaluator-cog had adopted
      python-test.yml without its typecheck input and went untyped the same
      way. The gate was removed on 2026-09-23.
  - id: TEST-013
    title: Operational delays sourced from config, not hardcoded
    status: convention
    dimension: testing_coverage
    severity: INFO
    applies_to: [pipeline-cog, api-service, react-app]
    description: >
      Deliberate delays and waits in production code — retry intervals,
      poll sleeps, request timeouts — should be sourced from Settings or
      environment variables rather than hardcoded. This allows them to be
      set to zero or near-zero in test environments without modifying
      source code, keeping test runs fast without changing behavior.
      This is a quality-of-life convention, not a blocking requirement.
      Python: source from Settings or os.getenv(), default to production value.
      TypeScript: source from process.env, default to production value.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Python: search src/**/*.py for hardcoded numeric arguments to
      time.sleep(), retry_delay_seconds=, timeout=, and backoff/tenacity
      wait parameters. Flag any non-zero literal value not read from a
      settings field or os.getenv().
      TypeScript: search src/**/*.ts for hardcoded numeric arguments to
      setTimeout(), setInterval(), and retry/timeout parameters. Flag
      any non-zero literal not sourced from process.env.
      Remediation: move the value to Settings/env var with a sensible
      production default. Tests override via environment.

  # ─────────────────────────────────────────────
  # TEST LAYERS (ADR-012)
  # Each layer proves something the others cannot. These rules require
  # the layer to exist and run, not a quantity of it.
  # ─────────────────────────────────────────────

  - id: TEST-014
    title: Has unit tests
    status: requirement
    dimension: testing_coverage
    severity: ERROR
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library, react-app]
    description: >
      The repo has unit tests — tests of its logic in isolation, with no
      network, database or filesystem beyond temporary files — and CI runs
      them on every push. They are the fast, numerous base of the pyramid
      (TEST-000), and the only layer cheap enough to cover edge cases
      exhaustively. See ADR-012.
    checkable: true
    check_notes: >
      LLM CHECK.
      (1) [deterministic] Find test files: Python tests/**/test_*.py or
      *_test.py; TypeScript src/**/*.test.ts(x), src/**/*.spec.ts(x) or
      __tests__/**. Flag if there are none.
      (2) [deterministic] Parse .github/workflows/*.yml (or the reusable
      workflow a job calls). Flag if no job triggered on push runs the test
      command (pytest, `uv run pytest`, `pnpm test`, `vitest`, or the
      shared python-test.yml workflow).
      (3) [LLM] Judge whether the tests found are unit tests: they call the
      code under test directly and stub its I/O. A suite made only of
      integration or end-to-end tests does not satisfy this rule.
      Remediation: add tests for the repo's pure logic first — parsing,
      normalisation, decisions — and run them in CI's test job.
    origin: >
      ADR-012, 2026-09-29.

  - id: TEST-015
    title: Has integration tests
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [api-service, pipeline-cog]
    description: >
      The repo has integration tests — tests that exercise it through its
      real entry point with its own parts wired together — and CI runs them
      on every push.
      For an api-service: requests through the app, against a database of
      the production engine (Postgres, not SQLite or a mock), because driver
      behaviour such as error wrapping, constraint names and type coercion
      is part of what is tested. External services are stubbed at the
      boundary. The test database is disposable and never production's
      (TEST-009).
      For a pipeline-cog: the handler invoked end to end on a realistic
      input, with external services stubbed at the HTTP boundary (TEST-007).
      See ADR-012.
    checkable: true
    check_notes: >
      LLM CHECK.
      (1) [deterministic] api-service: flag if no CI workflow provides a
      database of the production engine to the test job — a `services:`
      entry (e.g. postgres), a container started in a step, or a documented
      equivalent — or if no test runs against it (a DATABASE_URL pointed at
      that service, an integration test config or directory).
      (2) [deterministic] api-service: flag in-memory SQLite or a mocked
      database session as the only database the tests use.
      (3) [LLM] pipeline-cog: judge whether at least one test invokes the
      handler or flow end to end, stubbing only external services, rather
      than testing functions one at a time.
      Remediation, api-service: add a Postgres service to CI, run
      migrations in the test setup, reset tables between tests, and send
      real requests through the app.
    origin: >
      ADR-012, 2026-09-29. deejaytools-api's unique-conflict handlers
      returned 500 instead of 409 because Drizzle wraps the Postgres error;
      unit tests mocked the database and could not see it.

  - id: TEST-016
    title: Has contract tests against the APIs it calls, when it calls one
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [all]
    description: >
      A repo that calls an API owned by another repo in the fleet has a
      contract suite: its expectations of that API — endpoints, response
      shapes, access rules — checked against the provider's deployed dev
      instance. The suite is consumer-driven and lives with the consumer,
      because the consumer's expectations are the contract. It runs when
      either side changes: on a push to the consumer, and when the provider
      reports a successful dev deploy, so it meets the API that is live.
      A consumer that calls through a shared client library may keep the
      suite in that library, once, instead of in every consumer.
      Contract tests write data, so they run only against dev, only with
      development credentials, and never concurrently with another suite
      writing to the same environment. A repo that calls no fleet API has
      no subject for this rule. See ADR-012.
      Not to be confused with TEST-010, which asks an API to assert its own
      response envelope.
    checkable: true
    check_notes: >
      LLM CHECK.
      (1) [deterministic] Decide whether the repo calls a fleet API: a
      configured base URL naming a service in ecosystem.yaml (e.g.
      VITE_API_URL, KAIANO_API_BASE_URL, a hardcoded fleet API host in
      source), or a dependency on a shared client library for one. If none,
      skip without emitting a finding.
      (2) [deterministic] Find the contract suite — in this repo, or in the
      shared client library it calls through — and a workflow that runs it.
      Flag if neither exists.
      (3) [LLM] Judge whether the suite calls a deployed dev instance
      (not a mock or a local server), guards against running on production,
      and is triggered by the provider's dev deploys as well as the
      consumer's pushes.
    origin: >
      ADR-012, 2026-09-29. deejaytools-com's contract suite, dispatched by
      deejaytools-api after each dev deploy.

  - id: TEST-017
    title: Has end-to-end tests
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [react-app]
    description: >
      The app has end-to-end tests: a real browser driving the deployed dev
      site, signed in through the identity provider's development instance,
      along the paths people actually use. One or a few — the happy paths.
      They run after each dev deploy, so a failure lands on the change that
      caused it; not nightly (TEST-000). Like contract tests they write
      data, so they run only against dev, with development credentials, one
      suite at a time. See ADR-012.
    checkable: true
    check_notes: >
      LLM CHECK.
      (1) [deterministic] Flag if the repo has no browser test framework
      configured (playwright.config.*, cypress.config.*) with at least one
      test file.
      (2) [deterministic] Flag if no workflow runs those tests, or if the
      workflow runs them only on a schedule.
      (3) [LLM] Judge whether the tests target a deployed dev environment
      rather than a local dev server, and refuse production.
    origin: >
      ADR-012, 2026-09-29.

  - id: TEST-018
    title: Every API route is exercised by an integration test, and the suite enforces it
    status: requirement
    dimension: testing_coverage
    severity: WARN
    applies_to: [api-service]
    description: >
      The integration suite (TEST-015) records every request it makes and,
      when it finishes, fails if any route the app registers was not called
      by some test. A route that genuinely cannot be exercised is listed in
      the suite with a written reason; the suite also fails on a listed
      route that is now called, or that no longer exists, so exemptions
      cannot outlive their reason. A new endpoint therefore cannot merge
      without a test or a stated reason.
      This is the enforced form of TEST-010's intent: coverage counted by
      the suite itself, against the routes the app actually registers,
      rather than by matching decorators to test names. See ADR-012.
    checkable: true
    check_notes: >
      LLM CHECK.
      (1) [deterministic] Flag if the repo has no integration suite
      (TEST-015); this rule then has nothing to add.
      (2) [LLM] Find the ledger: code that records each request made by the
      integration tests, reads the app's registered routes (e.g. Hono
      `app.routes`, FastAPI `app.routes`), and fails the run on routes
      neither exercised nor listed with a reason. Flag if absent.
      (3) [LLM] Flag an exemption list whose entries carry no reason, or a
      ledger that does not fail on stale entries.
    origin: >
      ADR-012, 2026-09-29. deejaytools-api
      `src/test/integration/route-ledger.ts`. Its one exemption, the song
      upload, was removed once a test stood in for Google Drive.

  - id: TEST-019
    title: Coverage has a floor that only rises
    status: convention
    dimension: testing_coverage
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library, react-app]
    description: >
      CI measures coverage and fails when it falls below a floor, and the
      floor is the repo's own current coverage, raised automatically when
      coverage rises. There is no target number: a fixed percentage invites
      tests written to reach it and says nothing about a repo already above
      it, while a floor that follows the repo upward keeps whatever level
      it has reached. Lowering the floor is a deliberate, reviewed edit.
      Vitest: `coverage.thresholds` with `autoUpdate` rounding down
      (`autoUpdate: (n) => Math.floor(n)`). pytest-cov: `--cov-fail-under`
      from a committed value updated when coverage rises. See ADR-012.
    checkable: true
    check_notes: >
      LLM CHECK.
      (1) [deterministic] Flag if CI does not run tests with coverage
      (`vitest --coverage`, `pnpm test:coverage`, `pytest --cov`).
      (2) [deterministic] Flag if no coverage threshold is configured
      (Vitest `coverage.thresholds`; pytest `--cov-fail-under` or
      `[tool.coverage.report] fail_under`).
      (3) [LLM] Judge whether the threshold follows the repo upward
      (autoUpdate, or a documented update step) rather than being a fixed
      target set once.
    origin: >
      ADR-012, 2026-09-29. Chosen over a fixed percentage and over diff
      coverage; both deejaytools repos' `vitest.config.ts`.

  - id: TEST-020
    title: Tests do not depend on the time of day
    status: convention
    dimension: testing_coverage
    severity: INFO
    applies_to: [all]
    description: >
      A test passes at any hour. Tests that create date-bounded data —
      events, sessions, schedules — compute dates in the timezone the code
      under test uses, not UTC, and give themselves room either side of
      midnight when the data spans the current time. Otherwise the suite
      fails for part of every day: in Chicago, from 19:00 or 18:00, when
      UTC has already reached tomorrow. Where the code accepts an injected
      clock, fixing the clock is better still. See ADR-012.
    checkable: true
    check_notes: >
      LLM CHECK.
      Look in test files and test fixtures for dates derived from the
      current time in UTC — e.g. `new Date().toISOString().slice(0, 10)`,
      `datetime.utcnow().date()`, `date.today()` on a UTC runner — used as
      calendar dates for data the code then compares in another timezone.
      Flag each, naming the file and line. Do not flag timestamps (epoch
      milliseconds, instants), which carry no calendar day.
    origin: >
      2026-09-28: UTC dates broke deejaytools-com's contract and end-to-end
      suites and deejaytools-api's integration suite on the same evening,
      once UTC had reached the next day. The API checks session times
      against the event's dates in the event's timezone.

  - id: TEST-GAP-001
    title: "GAP: Most existing cogs have import-level tests only"
    status: gap
    dimension: testing_coverage
    severity: INFO
    applies_to: [pipeline-cog, api-service]
    description: >
      Most existing cogs currently have import-level tests only. This is a
      known gap with active remediation underway. Per-repo remediation
      sequencing (which cog goes first, priority order) lives in
      BACKLOG.md — not here — so it can be edited without churning the
      standards catalog. When a cog is remediated, this gap entry is
      closed for that cog and it is marked as compliant with TEST-001
      through TEST-004.
    checkable: true
    check_notes: >
      LLM CHECK.
      Apply TEST-001 through TEST-004 to this repo in sequence. This
      rule is the rollup — it fires as INFO when ANY of the four
      critical-path tests (TEST-001 normalization, TEST-002 dedup,
      TEST-003 failure path, TEST-004 output shape) is missing. It is
      LLM-judged because the underlying four rules are LLM-judged (see
      their check_notes). This GAP rule is closed for a cog when all
      four underlying rules pass.
