# ecosystem-standards / delivery.yaml
# Continuous delivery, versioning, and observability standards.

standards:

  # ─────────────────────────────────────────────
  # OBSERVABILITY
  # ─────────────────────────────────────────────

  - id: CD-001


    title: Feature flags for major functionality toggles
    status: convention
    dimension: cd_readiness
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, static-site, react-app]
    description: >
      Feature flags are used to decouple deployment from release. They gate
      major sections of functionality — not minor implementation details.
      The canonical use cases are:

        Kill switches: disable a risky integration (e.g. Anthropic API calls
          in evaluator-cog) without a redeploy.
        Readiness gates: API ships a new endpoint; frontend UI is hidden until
          the flag is enabled. Allows frontend code to be merged and deployed
          independently of API readiness.
        Maintenance mode: return 503 gracefully during migrations without
          touching code.

      Flags are stored in the feature_flags table in api-kaianolevine-com's
      PostgreSQL database and served via GET /v1/feature-flags.
      The public read endpoint is unauthenticated. Write endpoints
      (POST, PATCH, DELETE /v1/feature-flags/:key) require Clerk JWT auth
      with admin role.

      Flag naming convention: <service>.<feature>
      Examples:
        evaluator_cog.llm_soft_rules
        evaluator_cog.conformance_check
        watcher_cog.drive_polling
        api.maintenance_mode

      Flag anatomy — each flag must have:
        key:         string identifier
        enabled:     boolean
        description: why it exists and when it should be deleted
        permanent:   boolean — true for infrastructure flags (maintenance_mode),
                     false for rollout/readiness flags (must be deleted post-rollout)

      Lifecycle contract:
        1. Ship code with flag check
        2. Deploy and activate when ready by flipping the flag via the admin panel
        3. For non-permanent flags: ship a follow-up PR removing the flag check
           once the feature is fully rolled out and stable
        4. Delete the DB row after the cleanup PR merges
        Include a comment in code pointing to the flag key so it is easy to find:
          # feature flag: evaluator_cog.llm_soft_rules

      Flags are NOT used for:
        - Fine-grained A/B testing or percentage rollouts
        - Per-user targeting
        - Replacing per-cog configuration (environment, Terraform variables)
        - Gating minor implementation details

      Clients check flags at runtime (not build time) via a short-TTL
      in-memory cache (30–60 seconds per process) to avoid hitting the API
      on every request. Astro static sites fetch flags client-side on load.
      Fail-open or fail-closed behavior must be intentional and documented
      per flag.
    checkable: false

  - id: CD-002


    title: Sentry for error tracking — all production services
    status: requirement
    dimension: cd_readiness
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, react-app]
    description: >
      All production services integrate Sentry for unhandled exception
      tracking. This includes FastAPI services, Hono services, and Python
      cogs (always-on worker services). Free tier is
      sufficient. Sentry is initialised at service entry point before
      any application logic runs. SENTRY_DSN is set as an environment
      variable — never hardcoded. The same Sentry project may be shared
      across related services or a dedicated project used per service.
      Sentry covers Layer 3 observability (unhandled exceptions). It does
      not replace structured logging (Layer 2) or liveness monitoring (Layer 1).
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check for sentry-sdk in pyproject.toml (Python) or @sentry/node in
      package.json (TypeScript). Check for sentry_sdk.init() or Sentry.init()
      call at service entry point. Check for SENTRY_DSN in .env.example.
      Flag any production service missing any of these three.

  - id: CD-003


    title: Structured logging via shared library
    status: requirement
    dimension: cd_readiness
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, static-site, react-app]
    description: >
      All Python services use common-python-utils logger. All TypeScript
      services use common-typescript-utils logger. Never use print() in production
      code paths. Log output is JSON-formatted in production.

      Standard log event shape (all services):
        timestamp: ISO 8601
        service:   repo name (e.g. watcher-cog, api-kaianolevine-com)
        level: DEBUG | INFO | WARN | ERROR
        category: infra | pipeline | data | api
        event:     snake_case event name (e.g. trigger_fired, file_processed)
        context: key-value pairs specific to the event

      Category definitions:
        infra:    service lifecycle, triggers fired/not fired, heartbeats,
                  Drive poll results
        pipeline: file processed/skipped/failed, pipeline completed/failed,
                  job enqueued / job received
        data:     data quality issues, schema violations, evaluation findings,
                  duplicate detection
        api:      HTTP errors (4xx/5xx), slow responses (>2s), external
                  API failures, auth failures

      Emoji prefixes used for human-readable local output only.
      Structured JSON is the production format.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Scope: "production code paths" means Python files under `src/**/*.py`
      and TypeScript files under `src/**/*.ts`. Explicitly NOT in scope:
      `tests/**/*`, `scripts/**/*`, `examples/**/*`, `docs/**/*`,
      `alembic/versions/**/*`, and any file whose basename starts with
      `migrate_` or `backfill_`.
      (1) Flag any bare `print(...)` call in Python production code. Exempt
          calls inside a `if __name__ == "__main__":` block at the end of
          a module used as a CLI entry point (these are legitimate
          command-line outputs).
      (2) Flag any `console.log`, `console.info`, `console.debug`,
          `console.warn`, or `console.error` call in TypeScript production
          code. Exempt files in `src/cli/` or files explicitly registered
          as CLI entry points in `package.json` `bin` field.
      (3) Require that the logger used in production code is imported from
          the shared library. For Python: flag any file that configures
          its own logger via `logging.basicConfig(...)`,
          `logging.getLogger(__name__)` followed by `.addHandler(...)`,
          or `structlog.configure(...)` if that file is not itself the
          shared library's logger module. For TypeScript: flag any file
          calling `pino(...)`, `winston.createLogger(...)`, or equivalent
          logger-factory call outside of the shared library itself.

  # ─────────────────────────────────────────────
  # CI/CD
  # ─────────────────────────────────────────────

  - id: CD-004


    title: Pinned GitHub Action versions should resolve
    status: convention
    dimension: cd_readiness
    severity: ERROR
    applies_to: [all]
    description: >
      Every `uses: owner/repo@vN` reference in `.github/workflows/` should
      point at a version tag that exists in the action's release history.
      Invalid tags cause CI to fail silently at workflow-parse time.
      Verification is expected at the point of change — when bumping or
      adding an action pin, confirm the tag exists in the upstream repo.
      This is a code-review expectation rather than a pipeline gate;
      automating it would mean hitting the GitHub API for every pinned
      tag on every conformance run, which is costly and doesn't add
      signal over the first CI execution catching the typo.
    checkable: false
    origin: "Invalid version tags cause CI to fail silently, creating false confidence in a passing pipeline."

# VER-001..VER-006 moved to standards/versioning.yaml.

  - id: CD-006


    title: GitHub Actions is CI/CD only — not a trigger relay
    status: requirement
    dimension: structural_conformance
    severity: ERROR
    applies_to: [all]
    description: >
      GitHub Actions handles lint, tests, deploys, and semantic-release.
      It does not trigger pipeline flows. Drive-event triggers go through
      watcher-cog, which asks api-kaianolevine-com to enqueue the work
      onto the cog's queue; the API is the only producer. A release job's
      conformance request through the shared evaluate.yml is the one
      sanctioned call from a workflow. `repository_dispatch` as a trigger
      relay for cogs is a retired pattern.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Scan all .github/workflows/*.yml files:
        (1) Flag any workflow with `on: repository_dispatch:` as a trigger.
            Exception: if the repository_dispatch workflow only performs
            CI/CD tasks (tests, build, deploy) and does not invoke
            application code or start pipeline work, it is allowed. Read the
            workflow body to distinguish.
        (2) Flag any scheduled workflow (`on: schedule: - cron:`) whose
            job body contains HTTP calls to Prefect Cloud API
            (`api.prefect.cloud`), invocations of prefect CLI commands
            (`prefect deployment run`, `prefect flow-run create`), or
            direct imports of application modules as orchestration entry
            points.
            Allowed scheduled workflows: drift-check, dependency update
            (dependabot, renovate), nightly test runs.
        (3) Flag any workflow that POSTs to an internal API endpoint
            that starts pipeline work (e.g. /v1/trigger, /v1/<cog>/runs) —
            that belongs to watcher-cog, not to a workflow acting as a
            relay. The shared evaluate.yml's conformance request is the
            exception.

  - id: CD-007


    title: Healthchecks.io for trigger cogs
    status: requirement
    dimension: cd_readiness
    severity: WARN
    applies_to: [trigger-cog]
    description: >
      Trigger cogs — services running their own continuous polling loop without
      external orchestration visibility — integrate Healthchecks.io as a dead
      man's switch. If a trigger cog silently dies, no work is triggered and
      nothing else in the system notices.
      The service pings HEALTHCHECKS_URL on every poll cycle. If the ping goes
      silent beyond the grace period, Healthchecks.io sends an email alert.
      Recommended settings: period 1 minute, grace 5 minutes.
      HEALTHCHECKS_URL is set as an environment variable — never hardcoded.
      Free tier is sufficient.
      Pipeline cogs are out of scope: they run on Lambda and hold no process
      between jobs, so there is nothing to ping. Their liveness signal is the
      dead-letter-queue alarm (CD-010, Layer 1).
      The test: if a silent crash would cause work to stop being triggered with
      no external visibility, Healthchecks is required.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Apply only to trigger cogs (cog_subtype: trigger in ecosystem.yaml).
      For those services: check for HEALTHCHECKS_URL in .env.example and a
      heartbeat ping call in the main poll loop. Flag trigger cogs missing
      this integration. Do not flag pipeline cogs (cog_subtype: pipeline)
      — they are exempt by design.

  - id: CD-008


    title: Log levels used consistently and intentionally
    status: requirement
    dimension: cd_readiness
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, static-site, react-app]
    description: >
      Log levels follow a strict contract across all services:
        DEBUG: internal state useful for local debugging only.
               Never emitted in production by default.
        INFO:  meaningful lifecycle events — service started, file
               processed, trigger fired, pipeline completed. Reviewable
               weekly. Default production level.
        WARN:  something unexpected happened but the service recovered.
               Skipped files, retried calls, degraded behaviour. Reviewed
               promptly.
        ERROR: something failed and requires attention. Unhandled
               exceptions, failed triggers, data integrity violations.
               Reviewed immediately.
      Never use ERROR for expected failure modes (e.g. file not found
      when that is a valid outcome). Never use INFO for high-frequency
      noise that would obscure meaningful events.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Search all Python source files for logger.debug, logger.info,
      logger.warning, logger.error calls. Flag logger.error used for
      file-not-found or similar expected outcomes: match regex patterns
      against strings passed to logger.error calls:
      (not found|no files|skipping|already exists|no new items). Flag error
      calls where the message string contains any of these. Flag
      logger.info calls inside tight loops or per-item processing that would
      produce high-frequency noise. Flag logger.debug calls that are present
      in production code paths without a DEBUG guard.

  - id: CD-009


    title: Structured log event shape — all services
    status: requirement
    dimension: cd_readiness
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, react-app]
    description: >
      All meaningful log events emitted by production services include
      these fields:
        timestamp: ISO 8601
        service:   repo name (e.g. watcher-cog, api-kaianolevine-com)
        level:     DEBUG | INFO | WARN | ERROR
        category:  infra | pipeline | data | api
        event:     snake_case event name (e.g. trigger_fired, file_processed)
        context:   key-value pairs specific to the event

      Category definitions:
        infra:    service lifecycle, triggers fired/not fired, heartbeats,
                  Drive poll results
        pipeline: file processed/skipped/failed, pipeline completed/failed,
                  job enqueued / job received
        data:     data quality issues, schema violations, evaluation findings,
                  duplicate detection
        api:      HTTP errors (4xx/5xx), slow responses (>2s), external
                  API failures, auth failures

      Log output is JSON in production, human-readable with emoji prefixes
      in local development. The shared library (common-python-utils for
      Python, common-typescript-utils for TypeScript) provides the logger — services
      do not configure logging inline.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check that log calls use the shared library logger, not a custom
      inline configuration. Flag services importing logging directly and
      configuring their own handler/formatter without using the shared library.

  - id: CD-010


    title: Three-layer observability stack — all production services
    status: requirement
    dimension: cd_readiness
    severity: ERROR
    applies_to: [pipeline-cog, trigger-cog, api-service, react-app]
    description: >
      Every production service implements all three observability layers:
        Layer 1 — Liveness:    Healthchecks.io for always-on workers.
                               Railway auto-restart for Railway services.
                               For queue-driven pipeline cogs, an alarm
                               on the dead-letter queue with an action —
                               there is no process to be alive between
                               jobs, and a job that fails every retry is
                               the event that must reach a person.
        Layer 2 — Structured logs: common-python-utils or common-typescript-utils
                               logger emitting JSON events with standard shape.
                               Queryable in Railway log viewer or Better Stack.
        Layer 3 — Exceptions:  Sentry capturing all unhandled exceptions
                               with full stack trace and context.
      These three layers are non-overlapping and non-redundant:
        Layer 1 catches: process died, service unreachable
        Layer 2 catches: business logic errors, skipped work, slow operations
        Layer 3 catches: unhandled exceptions and crashes
      A service missing any layer has a blind spot in production.
      Pipelines additionally report every run — and every run that
      raised — to the notification channel under a run id, which is their
      run history.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      For each production service, verify all three layers are present.
      Layer 1: HEALTHCHECKS_URL in .env.example + ping call in main loop
               (trigger cogs — HTTP services rely on Railway restart).
               Pipeline cogs: an aws_cloudwatch_metric_alarm on the
               dead-letter queue with non-empty alarm_actions, in
               infra/*.tf.
      Layer 2: shared library logger imported and used throughout.
      Layer 3: Sentry initialised at entry point, SENTRY_DSN in .env.example.
      Flag any service missing any layer.

      SUPERSESSION: When CD-010 fires and flags Layer 2 or Layer 3 as absent,
      do not also raise separate findings for CD-009 (structured logging) or
      CD-002 (Sentry) for the same service in the same run. CD-010 is the
      composite rule — CD-002 and CD-009 are its sub-components. Raising all
      three produces duplicate findings for one root cause. If CD-010 passes
      (all layers present), CD-002 and CD-009 may still fire independently
      for structural issues not captured by the composite check.

  - id: CD-011


    title: Doppler as canonical secret store
    status: requirement
    dimension: cd_readiness
    severity: ERROR
    applies_to: [all]
    description: >
      Doppler must be the canonical secret store and single source of truth
      for all infrastructure secrets across the MiniAppPolis ecosystem.
      This includes API keys, database URLs, service tokens, internal API
      keys, Sentry DSNs, Healthchecks URLs, and Clerk credentials.

      Doppler syncs automatically to:
        Railway:        all API services and cogs receive secrets via
                        the Doppler → Railway native sync
        GitHub Actions: CI secrets synced via Doppler → GitHub integration
        Cloudflare Pages: secrets synced via Doppler CLI in CI/CD
        AWS Lambda:     not a sync. Each cog's infra/tf wrapper reads
                        Doppler at plan/apply time and passes the values
                        as TF_VAR_*; Terraform sets them on the function.
                        A rotated secret reaches the function on the next
                        apply, not automatically.

      Secret management workflow:
        - All secret changes are made in Doppler only
        - Doppler pushes changes to downstream platforms automatically
        - Never manually set secrets in Railway, GitHub, or Cloudflare
          when Doppler manages that service — manual overrides must not
          diverge from Doppler as the source of truth
        - .env.example lists all required secret keys with no values —
          this file is the human-readable contract of what a service needs

      Doppler project structure:
        One Doppler project per service or cog.
        Environments: development, staging, production (minimum).

      The Lambda path is the one place a rotation is not pushed: after
      rotating a secret a Lambda consumes, run the cog's infra/tf apply.
      Secrets never live in terraform.tfvars, and Terraform never creates
      access keys — those are minted by hand and stored in Doppler.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check that .env.example exists and lists all required secret keys.
      Flag any service with secrets hardcoded in source or committed
      .env files.       Flag any service manually setting Railway env vars
      that must be Doppler-managed.

  - id: CD-014


    title: Cloudflare Pages for all static site deployments
    status: requirement
    dimension: cd_readiness
    severity: WARN
    applies_to: [static-site]
    description: >
      All Astro static sites deploy to Cloudflare Pages. Not Netlify, not
      Vercel, not GitHub Pages. Cloudflare Pages provides dev/prod environment
      split via branch deploy previews, zero-config CDN, and consistent with
      the broader ecosystem's Cloudflare footprint (Workers, DNS). New static
      sites are connected to Cloudflare Pages before being considered deployed.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      For Astro site repos, check ci.yml for Cloudflare Pages deploy steps or
      wrangler references. Check README for Cloudflare Pages deploy instructions
      or URLs (pages.dev domain). Flag if a different deployment target is
      referenced (netlify.toml, vercel.json, .github/workflows with gh-pages).
      If no deployment target is detectable, flag as unverified.

  - id: CD-017


    title: Version-controlled Railway restart policy — ON_FAILURE
    status: requirement
    dimension: cd_readiness
    severity: ERROR
    applies_to: [trigger-cog, api-service]
    description: >
      Every Railway-hosted service declares its restart policy in a
      version-controlled railway.json at the repo root, with
      restartPolicyType "ON_FAILURE" and a restartPolicyMaxRetries of at
      least 10.

      Version-controlled rather than dashboard-configured so the setting is
      reviewable in a PR, diffable over time, and reproduced automatically
      when a service is recreated. A dashboard-only value is invisible to
      code review and silently lost on service recreation — which is how
      the July 2026 fleet-down incident ended up with restartPolicyType
      NEVER on services nobody remembered configuring.

      ON_FAILURE rather than ALWAYS: a clean exit (exit code 0) is a
      deliberate shutdown and should not be fought. Only non-zero exits —
      crashes — are restarted.

      The floor is 10 rather than "any value" because the retry count caps
      how long an outage the service rides out unattended; a low value
      caps it silently.

      Pipeline cogs are out of scope: they run on Lambda, have no process
      to restart, and a failed job is retried by its queue instead — see
      PIPE-017.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) Confirm railway.json exists at the repo root and parses as JSON.
          Flag if absent or malformed.
      (2) Confirm deploy.restartPolicyType == "ON_FAILURE". Flag "NEVER",
          "ALWAYS", null, or a missing key.
      (3) Confirm deploy.restartPolicyMaxRetries is an integer >= 10. Flag
          a lower value, null, or a missing key.
      (4) Confirm deploy.startCommand is present and non-empty. Flag if
          absent — a railway.json that omits it leaves the effective start
          command dashboard-owned, which defeats the purpose of the file.
      Monorepo services: read railway.json at the service's monorepo_path,
      falling back to the repo root.
    origin: >
      2026-07-22: after a transient Prefect Cloud 503 crashed all four
      serve()-based cogs, none of them came back. Railway restart policy was
      NEVER (or an exhausted low cap) on every affected service, and the
      setting existed only in the dashboard, so nothing in any repo recorded
      or enforced it. See deejay-cog ADR-005 and ecosystem-standards ADR-006.

  - id: CD-018


    title: External-service failures are logged, reported, and captured in Sentry
    status: requirement
    dimension: cd_readiness
    severity: ERROR
    applies_to: [all]
    description: >
      Every failure in either class defined by PY-016 — COMMUNICATION
      FAILURE and RESPONSE ERROR — reaches all three observability layers,
      even when the application handles it and carries on:

        Log     — a structured log line via the shared logger (CD-009),
                  naming the provider and which of the two classes it was.
        Report  — a Pipeline Health finding via
                  mini_app_polis.pipeline_status with
                  source="external_dependency" and a provider=<id> extra
                  (ADR-007). Severity reflects what happened to the work,
                  which the application decides.
        Sentry  — an explicit sentry_sdk.capture_exception() call.

      The Sentry leg is the one that needs stating, and the reason is
      fidelity rather than presence. Sentry's Python SDK enables its
      Logging integration by default with event_level=ERROR, so an
      ERROR-level record through the shared stdlib logger (CD-009)
      already produces a Sentry event without any explicit call — the
      give-up path in common-python-utils' google/_retry.py is an
      existing example. But a log-derived event carries a formatted
      string and nothing else: no exception object, so no stack trace,
      no exception type, and grouping driven by message text that
      changes with every interpolated provider name and error detail.
      sentry_sdk.capture_exception() is what produces a usable issue.
      "It shows up in Sentry somehow" is not the bar.

      This also extends Layer 3's remit. CD-002 and CD-010 scope Sentry
      to *unhandled* exceptions, and a provider failure the application
      catches in order to degrade gracefully is by definition handled.
      That is a deliberate, bounded exception to CD-010's
      "non-overlapping and non-redundant" framing: the three layers answer
      different questions about the same event — is the service alive,
      what happened during this run, and what was the exception with its
      stack and context — and a provider failure is precisely the case
      where an operator wants all three views.

      Two limits on Layer 3 that make the explicit capture load-bearing
      for cogs specifically, rather than a nicety:

        - A queue worker catches the exception raised for each record
          so it can report that record in batchItemFailures (PIPE-017)
          and let the rest of the batch succeed. The exception never
          reaches sys.excepthook or the Lambda runtime, so neither
          Sentry's Excepthook integration nor its AWS Lambda
          integration sees it — and that covers nearly all cog code.
          The run report covers the notification leg for that case,
          not the Sentry leg.
        - Failures at module import time happen before
          sentry_sdk.init() runs, whatever "initialise at the entry
          point" is taken to mean, and are structurally invisible to
          Sentry. deejay-cog's 2026-08-19 ModuleNotFoundError
          crash-loop produced zero Sentry events for this reason.

      This rule says nothing about how the failure is handled. Skipping a
      step, failing an item, aborting the run, and exiting the process are
      all valid and application-dependent (ADR-007, PRIN-002). It requires
      only that the failure is not silent.

      TELEMETRY CARVE-OUT. Providers whose only role is receiving our
      observability data are exempt and must fail silently: Sentry itself,
      and the finding-posting path (api-kaianolevine-com, and the
      credential verification that authenticates the call to it). A
      finding reporting that
      findings cannot be posted cannot be posted, and a Sentry capture of
      Sentry being unreachable has nowhere to go. Failures of these
      providers are logged and nothing more. post_run_finding is already
      best-effort by construction (deejay-cog ADR-004), as is the
      reporting call inside serve_resilience.

      Startup-lifecycle failures satisfy the Report leg via
      source="startup" rather than source="external_dependency" — see
      ADR-006. Do not emit both for one event.
    checkable: true
    check_notes: >
      LLM CHECK.
      (1) [deterministic] Confirm sentry_sdk is a declared dependency and
          sentry_sdk.init() is called at the service entry point. This
          overlaps CD-002 by design — CD-018 is unsatisfiable without it,
          and a repo failing both should see both findings. Do not accept
          an ERROR-level log call as satisfying the Sentry leg: the
          default Logging integration turns it into an event, but a
          message-only one with no exception attached. An explicit
          sentry_sdk.capture_exception() is required.
      (2) [deterministic] Locate handlers that catch the error types
          PY-016 requires (or catch around an outbound-call site) and then
          continue rather than re-raise — the degradation paths. For each,
          check the handler body for all three of: a shared-logger call, a
          post_run_finding / post_findings call, and a
          sentry_sdk.capture_exception call. Flag handlers missing any leg.
      (3) [deterministic] Where a finding is posted from such a handler,
          confirm source="external_dependency" and a provider= keyword are
          present. Flag a finding that reports a provider failure without
          naming the provider — an unattributable row is the problem this
          is meant to solve.
      (4) [deterministic] Confirm the telemetry carve-out is respected in
          the other direction: flag any sentry_sdk.capture_exception or
          post_run_finding call inside a handler wrapping a call to Sentry
          itself, to KaianoApiClient's evaluations POST, or to the
          credential verification on that path. That is the
          infinite-regress case.
      (5) [LLM] Judge whether any remaining swallowed external failure
          exists — a caught provider error whose handler neither re-raises
          nor emits any of the three legs. Bare `pass`,
          `contextlib.suppress` around an outbound call, or a lone `return
          None` are the shapes to look for. Exclude the carve-out
          providers in (4).
      A handler that re-raises is not flagged: the failure is still
      travelling and will be caught, reported, or captured as an unhandled
      exception further up.
      Exempt any repo with no Python runtime — no pyproject.toml means no
      sentry_sdk to declare and no handler to inspect. PY-016's failure
      classes are Python-side, so a repo shipping none has no subject here
      and must not be flagged.
    origin: >
      2026-08. Provider outages are currently indistinguishable from our
      own defects in Pipeline Health — a Spotify outage during
      process-new-files reports as sets_failed=N with nothing recording
      that a vendor was down. Separately, any provider failure a cog
      handles in order to degrade never reaches Sentry at all, because
      CD-002 and CD-010 scope Sentry to unhandled exceptions. The result
      is that the ecosystem's most routine class of failure is its least
      observable. See ADR-007.

  - id: CD-019


    title: Bearer credential contract — Clerk sessions for humans, named keys for machines
    status: requirement
    dimension: structural_conformance
    severity: ERROR
    applies_to: [all]
    description: >
      All authenticated calls to ecosystem APIs use a single
      `Authorization: Bearer <credential>` header. The header carries one
      of exactly two credential types, determined by who the caller is:

        - Clerk session JWTs (humans) — RS256, verified locally by the
          receiving service against the issuer's JWKS document, cached in
          process. Multi-issuer: `CLERK_ISSUERS` is a JSON array of
          `{issuer, jwks_url}` objects, and `CLERK_ISSUER` /
          `CLERK_JWKS_URL` are the single-tenant shorthand. The `sub`
          claim is the principal subject.

        - Named machine keys (cogs and services) — an opaque per-machine
          string, verified locally by constant-time comparison against
          the set the receiving service holds in its own environment. The
          matched key names the caller: the key IS the identity claim, so
          no machine name is ever asserted in the request. The matched
          name is the principal subject under issuer `apikey`.

      Discrimination is structural, by dot count: exactly two dots is a
      JWT and routes to the issuer verifier, anything else routes to the
      machine-key verifier. There is no fallback between the two paths —
      a credential that fails the path it routed to is rejected, not
      retried against the other.

      Each machine holds its own key. Keys are Doppler-managed under
      `<MACHINE_NAME>_API_KEY` (`deejay-cog` → `DEEJAY_COG_API_KEY`);
      `KAIANO_API_KEY` is the unnamed fallback for a caller that declares
      no machine name, and a caller relying on it is unattributable.
      Key material never reaches a database — not plaintext, not hashed.
      The principal store holds the machine's name and its grants; the
      secret stays in configuration.

      Required env vars on any API enforcing this rule:
        - CLERK_ISSUERS, or CLERK_ISSUER + CLERK_JWKS_URL
        - <MACHINE_NAME>_API_KEY for every machine the service declares

      Required env vars on any cog or service calling an ecosystem API:
        - its own <MACHINE_NAME>_API_KEY (or KAIANO_API_KEY)

      Two mechanisms are retired and must not reappear. The
      `X-Internal-API-Key` shared-secret header was superseded during
      Project Keystone. Clerk M2M opaque tokens — `CLERK_SECRET_KEY`,
      `POST https://api.clerk.com/v1/m2m_tokens/verify`, and
      `common_python_utils.auth.get_m2m_token` — were superseded by this
      rule: one secret shared across the whole fleet resolved every cog
      to the same subject, so writes could not be attributed, and it put
      a vendor round trip on the path of every internal write. Any
      surviving reference to either in source, documentation, or tooling
      is drift and must be removed. See ADR-008.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.

      For service/cog repos (callers):
        (1) If the repo makes outbound HTTP calls to an ecosystem API,
            require that its client is constructed with a machine name —
            `KaianoApiClient.from_env("<machine-name>")`,
            `KaianoApiClient(machine_name=...)`, or an equivalent that
            resolves a per-machine key. Flag a repo that calls an
            ecosystem API without one: it authenticates as the unnamed
            fallback and its writes are unattributable.
        (2) Flag any reference to `get_m2m_token`,
            `m2m_tokens/verify`, `machine_secret`,
            `X-Internal-API-Key`, `X-Owner-Id`, `resolve_or_provision`,
            or the FastAPI dependencies the scope model replaced
            (`get_current_caller`, `require_wcs_admin`,
            `require_wcs_service`) in `src/**`, `.env.example`, README,
            or CI config. Tests that mock the auth layer are exempt.
            A stale docstring still telling a reader to reach for one of
            these is not exempt. A docstring that *records the
            retirement* — naming the symbol in the same sentence that
            says it is gone, removed, retired or replaced — is the
            opposite of stale and is not a violation: it is the sentence
            explaining why the module looks as it does, and demanding
            its deletion would trade documentation for a green check.
            `CLERK_SECRET_KEY` is flagged only where it is used to
            obtain or verify a credential — a call to
            `m2m_tokens/verify`, or a token acquisition passed into an
            `Authorization` header the repo then sends to an ecosystem
            API. A frontend using it with Clerk's server SDK for
            session handling or to read user profiles from Clerk's
            backend API is a different, legitimate use and is not a
            violation of this rule.
        (3) Flag any construction of the `Authorization` header from a
            credential the repo minted itself — a locally signed JWT, or
            a token-exchange response. Callers present a configured key
            or a Clerk session they were handed; they do not mint
            credentials.
        (4) Verify `.env.example` documents the repo's own
            `<MACHINE_NAME>_API_KEY`. Flag any repo that calls an
            ecosystem API and declares no key variable.

      For API repos (receivers):
        (5) Verify the service consumes the shared `identity` library
            rather than implementing verification locally: require an
            import from `identity` (`identity.chain`, `identity.clerk`,
            `identity.apikey`). Flag any in-repo JWKS fetch, RS256
            decode, or constant-time credential comparison written
            outside that library — see XSTACK-005.
            "Credential" here is what this rule defines above: a Clerk
            session JWT or a named machine key, presented in the
            `Authorization` header. A constant-time comparison of
            anything else is out of scope — a webhook shared secret in
            its own header, or an HMAC taken over the request body — and
            must not be flagged. Those callers cannot present either
            credential type, so the remedy this clause prescribes
            (`identity.clerk` for sessions, `identity.apikey` for
            machine keys) does not exist for them, and a finding whose
            only available fix is to stop comparing in constant time
            argues for weaker code.
            Scope the check the way the other two primitives here are
            already scoped — a JWKS fetch has to look like an HTTP call
            to a JWKS URL, a decode has to name an asymmetric algorithm.
            A comparison counts when the Bearer path is visible around
            it (an `Authorization` header, a machine-key or Clerk
            lookup, or the token/JWT vocabulary of a local verifier) and
            does not count when the compared value is computed by
            HMAC-ing a payload.
        (6) Verify both populations are configured: a Clerk issuer set
            built from `CLERK_ISSUERS` or `CLERK_ISSUER` +
            `CLERK_JWKS_URL`, and a machine-key set built from
            per-machine environment variables. Flag a service that
            configures only one.
        (7) Flag any remote credential verification — an HTTP request to
            `api.clerk.com`, or any outbound call at all, inside the
            verification path. Verification is local.
        (8) Flag any persistence of key material: a model column,
            migration, or INSERT on a principal, machine, or issuer
            table whose column name matches `key|secret|token|hash`.
            (`jwks_url` is a URL, not key material, and is exempt.) The
            store holds names and grants only.
        (9) Flag any credential path that reads a machine name from the
            request — a header, query parameter, or body field naming
            the caller, machine, or service. The key names the caller.
    origin: >
      Every cog read the same `CLERK_SECRET_KEY` out of one shared
      Doppler config, so every M2M token resolved to the same subject: a
      catalog row written by deejay-cog and a pipeline row written by
      transcription-cog carried an identical owner_id, and no log, table,
      or column could say which cog wrote what. The same path put a
      synchronous `POST api.clerk.com/v1/m2m_tokens/verify` on every
      internal write, making Clerk an availability dependency of all
      cog-to-API traffic.
    supersedes: >
      CD-012 (Clerk M2M opaque tokens for machine callers, retired
      2026-09 per ADR-008), which itself superseded the
      `X-Internal-API-Key` shared-secret header (retired 2026-04,
      Project Keystone).

  - id: CD-020


    title: The lockfile is released with the version it locks
    status: requirement
    dimension: cd_readiness
    severity: ERROR
    applies_to: [all]
    description: >
      What deploys is what `uv.lock` resolves. So the lock has to agree
      with the declaration it was generated from, and has to keep
      agreeing across releases. Three conditions, which fail as one:

        - A release cannot stale the lock. The project's own version
          is sourced from a committed file (PY-017), so `[project]`
          declares `dynamic = ["version"]` and `uv.lock` records no
          version for the project itself. A release then writes the
          version file and never touches the lock. A lock that does
          record the project's version goes a version behind the moment
          a release succeeds, and every release after repeats it.

        - `uv.lock` is current: `uv lock --check` passes against the
          committed pyproject.toml.

        - The declaration does not contradict itself. Where a package
          appears in both the dependency list and `[tool.uv.sources]`,
          the version specifier in the dependency list must not name a
          different version than the source's pin. uv resolves from
          `[tool.uv.sources]` and ignores the specifier, so a
          disagreement is silent: the file says one version and the
          deploy installs another.

      Git sources pin an immutable ref — a release tag, not `main`, not
      a branch name, not a bare commit SHA. A floating ref means two
      deploys of the same commit can install different code.

      These are one requirement rather than three because each alone is
      insufficient. A current lock that records the project's version
      is current until the next release; a version-free lock does not
      fix one that is already stale; and both are worthless if the
      declaration they encode disagrees with itself.

      Re-locking in the release is not the remedy. PY-017 keeps
      `uv.lock` out of the release commit, and owns that half of the
      `.releaserc.json` shape; this rule reads the lock, not the
      release config.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
        (1) Parse `uv.lock` and find the `[[package]]` entry for the
            project itself: its name, PEP 503-normalised, equals
            `[project] name`, and its `source` is the project directory
            (`editable = "."` or `virtual = "."`). Flag the entry if it
            carries a `version` key, reporting that version and whether
            pyproject.toml declares a static `version` or
            `dynamic = ["version"]`. No entry for the project is not a
            finding; clause (2) covers a lock that does not match the
            declaration. Do not read `.releaserc.json` — PY-017 owns it.
        (2) Run `uv lock --check` against the checked-out tree. It exits
            non-zero when the lock needs updating. Flag only the
            lockfile-needs-updating result, not other failures to run.
            Report the project version where both files record one;
            under a dynamic version neither does, and the finding names
            the stale dependency graph instead.
        (3) Parse `pyproject.toml`. For each key in `[tool.uv.sources]`,
            find the matching requirement string in the project's
            dependency list and in every optional-dependency group. Flag
            when that requirement carries a version specifier (`==`,
            `>=`, `~=`, `<`) naming a version different from the
            source's `tag` or `rev`. A bare name with no specifier is
            correct and is not flagged.
        (4) Flag any `[tool.uv.sources]` git entry whose ref is not a
            version tag: `main`, `master`, any branch name, or a
            40-character hex SHA. A `rev` holding a tag string
            (`rev = "v4.0.0"`) satisfies this.
      Exempt any repo with no `uv.lock` — it is not uv-managed, and
      PY-001 is the rule for that.
    origin: >
      2026-09. api-kaianolevine-com crash-looped in production — 12
      restarts in 23 seconds on ModuleNotFoundError — because
      pyproject.toml disagreed with itself: the dependency list named
      common-python-utils v3.1.1 and identity v1.0.2 while
      `[tool.uv.sources]` pinned v3.1.0 and v1.0.1, and uv resolves from
      the sources table. Two further failures the same week traced to
      the same class of disagreement. Separately, the two shared
      libraries release without re-locking: identity and
      common-python-utils each went stale again within an hour of the
      release that was meant to fix them. Six of the eight uv-managed
      repos already run `uv lock` in `prepareCmd` and ship `uv.lock` as
      a release asset — this makes the majority convention the rule.

      Revised 2026-09-19. PY-017 (2026-09-06) moved every Python repo to
      a file-sourced dynamic version and took `uv.lock` out of the
      release commit, which removed the drift clause (1) was written
      against by a different route. Clause (1) still required the old
      relock-and-commit mechanism, so every uv-managed repo failed it
      while conforming to PY-017. It now checks the property the
      relock existed to protect: that a release cannot stale the lock.

# VER-007..VER-008 moved to standards/versioning.yaml.

  - id: CD-021


    title: Deployable services define their runtime image explicitly
    status: gap
    dimension: cd_readiness
    severity: WARN
    applies_to: []
    description: >
      A deployable service ships an image definition in its repository,
      so the runtime it executes in is reproducible from source rather
      than inferred at build time.

      Every service currently deploys via buildpack inference. That is a
      defensible choice at this scale — it is less to maintain, and the
      platform does it well — but it has a specific cost that is worth
      naming rather than absorbing: the runtime is not derivable from
      the repository. Base image, interpreter patch version, and system
      packages are decided by the builder at build time and are not
      recorded anywhere a reader or a checker can see them.

      This is `status: gap` because that is exactly what it is: a known,
      accepted, unclosed gap rather than a violation anyone is expected
      to fix this quarter. The rule exists so the gap is measured and
      visible instead of being an unstated assumption, and so that CD-022
      through CD-024 have a documented subject when an image appears.

      Promote to `convention` or `requirement` when the first service
      carries a Dockerfile and the cost of maintaining one is known
      rather than estimated.

      Scoped to no repo type while no service carries a Dockerfile. With
      the gap universal, a check could only restate it once per service
      per run, and those rows read as open violations beside the real
      ones. The gap is stated here instead.
    checkable: false
    check_notes: >
      NOT CHECKABLE while no service carries an image definition — every
      deployable repo would fail identically, so the finding carries no
      information the description does not.

      Becomes checkable when the first service adds a Dockerfile. Restore
      `applies_to: [pipeline-cog, trigger-cog, api-service]` and a
      deterministic check: pass if a `Dockerfile` exists at the repo root
      and the platform descriptor (`railway.json` / `railway.toml`)
      selects the dockerfile builder rather than leaving the builder
      unset. A Dockerfile the platform does not use is not a runtime
      definition.

  - id: CD-022


    title: Base images are pinned by digest, not by tag
    status: requirement
    dimension: cd_readiness
    severity: ERROR
    applies_to: [all]
    description: >
      Where a repository defines an image, every `FROM` line resolves a
      base by content digest rather than by tag.

      A tag is a moving pointer. `python:3.11-slim` is a different set of
      bytes this month than last, which means two builds of an unchanged
      commit can produce different runtimes and neither is wrong. Pinning
      by digest is the same discipline CD-020 applies to the dependency
      lock, one layer down: the declaration and the artifact must agree,
      and a name that resolves differently over time is not a
      declaration.

      CONDITIONAL: this rule has a subject only where a Dockerfile
      exists. A repo without one is not in violation here — the absence
      of an image definition is CD-021's concern, and reporting it twice
      would obscure which of the two is actually open.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) If no `Dockerfile` exists at the repo root, the rule has no
          subject — skip without emitting a finding.
      (2) Otherwise fail for every `FROM` line whose image reference does
          not contain `@sha256:`.
      (3) Report the offending line, not just the file — a multi-stage
          build can pin one stage and not another, and that is the common
          case.

  - id: CD-023


    title: The final image stage runs as a non-root user
    status: requirement
    dimension: cd_readiness
    severity: ERROR
    applies_to: [all]
    description: >
      Where a repository defines an image, its final stage declares a
      `USER` that is neither `root` nor `0`.

      A process that does not need to be root should not be, and none of
      these services do. The cost of getting this right at image-build
      time is one instruction; the cost of retrofitting it after a
      container has been running as root long enough for file ownership
      to depend on it is considerably more.

      The final stage is what matters. Build stages routinely need root
      to install packages, and constraining them buys nothing — only the
      stage that actually runs in production is in scope.

      CONDITIONAL on a Dockerfile existing, for the same reason as
      CD-022.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) If no `Dockerfile` exists at the repo root, skip without
          emitting a finding.
      (2) Resolve the final build stage — the last `FROM`, accounting
          for named stages.
      (3) Fail if that stage contains no `USER` instruction, or if its
          argument is `root` or `0`.
      A `USER` set in an earlier stage does not carry forward; only an
      instruction in the final stage satisfies this.

  - id: CD-024


    title: Deployable services declare memory and CPU limits
    status: convention
    dimension: cd_readiness
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service]
    description: >
      A deployable service states its memory and CPU ceiling in its
      platform descriptor rather than accepting whatever the platform
      defaults to.

      The value of this is not the enforcement, which the platform would
      apply anyway. It is that a declared limit is a stated expectation
      about the service's footprint, and a service that exceeds a limit
      it declared is telling you something — where a service that
      exhausts an unstated default is only telling you that a default
      existed.

      This pairs with OPS-003. The objective says what the service should
      achieve; the limit says what it is allowed to consume achieving it.
      Neither is capacity planning on its own, and together they are what
      capacity planning looks like at a scale where the answer is one
      instance.

      A `convention` because the correct limit for most of these services
      is not yet known, and a requirement to declare a number nobody has
      measured produces confident fiction.

      A pipeline cog's platform descriptor is its `infra/` Terraform, and
      its ceiling is the Lambda function's `memory_size` and `timeout`.
      Lambda allocates CPU in proportion to memory, so there is no
      separate CPU ceiling to declare; a stated memory size and timeout
      are the whole of the footprint.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Pipeline cogs: (1) read `infra/*.tf`; fail if no
      `aws_lambda_function` resource is declared there. (2) Fail if that
      resource does not set both `memory_size` and `timeout`.
      Other types: (1) read `railway.json` or `railway.toml` at the repo
      root. Absent → fail. (2) Fail if memory and CPU limit keys are
      absent or null. Accept either the platform's native limit keys or a
      documented equivalent — the check is that a ceiling is stated, not
      which spelling states it.


  - id: CD-025


    title: Release job depends on the security job
    status: requirement
    dimension: cd_readiness
    severity: ERROR
    applies_to: [pipeline-cog, trigger-cog, api-service, static-site, react-app, shared-library, standards-repo, shared-workflows]
    description: >
      Where a ci.yml carries both a `security` job and a `release` job, the
      release job names `security` in its `needs:`. A release job that lists
      only the test job runs whether or not the scan passed — gitleaks, the
      dependency audit and semgrep all report, and none of them gate.

      This fails invisibly. The security job's own status goes red exactly
      as it should, so the pipeline looks like it is working; the release
      simply proceeds beside it. Nothing in either job's output says the
      one was supposed to hold the other back.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) Parse `.github/workflows/ci.yml`. Skip if absent, or if it has no
          job named `security`, or no job named `release`.
      (2) Read the `release` job's `needs:`. Accept either a bare string or
          a list of strings.
      (3) Flag if `security` is not among them.
    origin: >
      website-astro-software, 2026-09: `needs: build` with a security job
      sitting beside it that gated nothing. Found by normalising job names
      across the fleet, not by any check.

  - id: CD-026


    title: Canonical ci.yml job set
    status: convention
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, static-site, react-app, shared-library, standards-repo, shared-workflows]
    description: >
      A repo's ci.yml names its jobs `security`, `test`, `release`,
      `deploy` and `evaluate`. The work job is `test` whatever it happens to
      run — a build, a typecheck, a lint, a schema validation. The name
      records the job's place in the pipeline, not its contents.

      `deploy` ships what `release` just versioned, for a repo whose release
      is a running service — a Lambda cog calling the shared
      `lambda-deploy.yml` in mini-app-polis/.github. It is a stage, not part
      of `release`: it needs cloud credentials the release job should not
      hold, and a stage that must run on the new code (a fleet sweep) says
      so with `needs: deploy`. It is a job rather than a workflow triggered
      `on: release`, because semantic-release publishes with GITHUB_TOKEN
      and GitHub starts no workflows from that token's events.

      `evaluate` is the conformance request a repo makes on its own
      release, calling the shared workflow in mini-app-polis/.github. It is
      a stage rather than a variation on `test`: it runs after `release`, it
      asks about the repository rather than about the change, and nothing
      waits for its answer.

      Not every repo needs every stage: a repo with no release path has no
      `release` job, and a repo that deploys through its host (Railway,
      Cloudflare Pages) has no `deploy` job. The rule is that a job present
      is named canonically, not that every job is present.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) Parse `.github/workflows/ci.yml`. Skip if absent.
      (2) Skip reusable workflows — a file whose `on:` declares
          `workflow_call` is called by others and names its jobs for its
          own reasons.
      (3) Collect the top-level keys under `jobs:`.
      (4) Flag any job name outside the set {security, test, release,
          deploy, evaluate}, naming the offending job.
      Only `.github/workflows/ci.yml` is in scope. Scheduled and
      dispatch-triggered workflows are not pipelines and are not checked.
    origin: >
      Five names for the same job across thirteen repos in 2026-09 —
      `test`, `build`, `ci`, `verify`, `validate` — which made cross-repo
      checks reason about job identity by position rather than by name.
      `deploy` joined in 2026-09, when evaluator-cog and deejay-cog moved to
      Lambda: both had the job, and the check flagged both on every release.
