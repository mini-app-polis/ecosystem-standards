# ecosystem-standards / python.yaml
# Standards for all Python services, cogs, and libraries.

standards:

  # ─────────────────────────────────────────────
  # TOOLING
  # ─────────────────────────────────────────────

  - id: PY-001
    title: uv for dependency management
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      uv replaces Poetry. Faster installs, simpler lockfile, better resolution.
      All new cogs use uv. Existing cogs migrate when touched.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check for uv.lock or [tool.uv] in pyproject.toml. Flag new repos using
      Poetry. Flag existing repos using Poetry only when actively being worked on.

  - id: PY-002
    title: ruff for linting and formatting
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      ruff replaces black + isort + flake8. Single tool, significantly faster.
      Configured in pyproject.toml.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check for [tool.ruff] in pyproject.toml. Flag if repo configures
      black, isort, or flake8 separately.

  - id: PY-003
    title: Python 3.11+ minimum version
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      Minimum version for new work is Python 3.11. Python 3.13 preferred.
      Type hints used throughout.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check requires-python in pyproject.toml. Flag if minimum is below 3.11.

  - id: PY-004
    title: Pydantic for all external data validation
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      All external data (CSV rows, API responses, Drive file metadata) validated
      through Pydantic models before processing. Replaces ad-hoc dict access.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      In each Python source file under src/, check for Pydantic model imports
      (from pydantic import BaseModel). Flag any module that accesses external
      data (CSV parsing, Drive API responses, HTTP responses) using raw dict
      access or positional indexing without a corresponding Pydantic model
      definition in the same repo. Flag any of the following access patterns
      on variables holding external data (CSV rows, API responses, Drive API
      responses): row[0] or row['key'] where row is the result of csv.reader or
      csv.DictReader; response.json() assigned directly to a variable without
      passing through a Pydantic model; positional tuple indexing (data[0],
      data[1]) on parsed external data.

  # ─────────────────────────────────────────────
  # PROJECT STRUCTURE
  # ─────────────────────────────────────────────

  - id: PY-005
    title: src layout required
    status: requirement
    dimension: structural_conformance
    severity: ERROR
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      All packages use src/<package_name>/ + tests/<package_name>/. No flat layouts.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check for presence of src/ directory. Flag if Python package files are at
      the repo root (flat layout).

  - id: PY-006
    title: common-python-utils declared as dependency
    status: requirement
    dimension: structural_conformance
    severity: ERROR
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      All cogs declare common-python-utils as a dependency. Shared behaviors
      live there, not duplicated per-repo. Flag if cog re-implements logging,
      API clients, or metadata helpers.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check pyproject.toml dependencies for common-python-utils. Flag if absent
      and repo is a Python cog.

  - id: PY-007
    title: pyproject.toml as single source of truth
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      pyproject.toml is the only configuration file. No setup.py, no requirements.txt.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check for presence of setup.py or requirements.txt at repo root. Flag if found.

  - id: PY-008
    title: pre-commit configured
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      ruff and basic hooks configured via .pre-commit-config.yaml. Runs on every commit.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check for .pre-commit-config.yaml at repo root. Flag if absent.

  - id: PY-009
    title: hatchling as build backend
    status: convention
    dimension: structural_conformance
    severity: INFO
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      hatchling is the ecosystem standard build backend for all Python packages.
      Already used by common-python-utils. Requires no [tool.setuptools] config.
      New repos must use hatchling from day one. Existing repos migrate as a chore commit.
    decision: "Decided: hatchling. March 2026. Rationale: already used by shared library, simpler config, modern default."
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check [build-system] requires in pyproject.toml. Flag if value is not hatchling.

  - id: PY-010
    title: ruff line length is 88
    status: convention
    dimension: structural_conformance
    severity: INFO
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      All Python repos set line-length = 88 in [tool.ruff] in pyproject.toml.
      Matches Python community default and Black. Ensures cross-repo consistency.
    decision: "Decided: 88. March 2026. Rationale: Python community default, matches Black, lower cognitive load on diff review."
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Parse [tool.ruff] line-length in pyproject.toml. Flag if value is not 88
      or if field is absent.

  # ─────────────────────────────────────────────
  # NAMING CONVENTIONS
  # ─────────────────────────────────────────────

  - id: PY-011
    title: Naming conventions — Python
    status: convention
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      Package name: snake_case matching repo name (hyphens become underscores).
      Module files: snake_case verb phrases (process_new_files.py).
      Functions: snake_case descriptive verbs (generate_dj_set_collection()).
      Constants: UPPER_SNAKE_CASE in config module.
      Pydantic models: PascalCase nouns (DjSetRecord, TrackRow).
      Log messages: emoji prefix for lifecycle events (🚀 start ✅ success ❌ failure).
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check the package name in pyproject.toml matches the repo name with
      hyphens converted to underscores. Check that the src/ directory name
      matches. Check that all .py filenames under src/ are snake_case.
      Check that Pydantic model class names in source files are PascalCase.
      Flag any module file using CamelCase or kebab-case naming.

      SPLIT IDENTITY CARVE-OUT: Some repos intentionally use different
      distribution names and import package names — common-python-utils
      publishes as miniapppolis-common-utils and imports as mini_app_polis;
      identity publishes as miniapppolis-identity because PyPI `identity`
      belongs to an unrelated library. This is legitimate when DOC-009 is
      satisfied: both names documented in __init__.py and README.md. Do not
      flag the distribution-vs-import mismatch if DOC-009 passes for that
      repo. Only flag it when the split is undocumented.

      WHICH NAME THE CONVENTION IS ABOUT. On a documented split, compare the
      IMPORT PACKAGE against the repo name, not the distribution name. A
      distribution name is a registry identifier chosen against a public
      namespace, and is sometimes forced by what is already taken there; the
      import package is what people write in source, and matching it to the
      repository is what makes a repo navigable. Judging the convention on
      the distribution name reports a mismatch the repo cannot fix without
      breaking every consumer — which is DOC-009's business to document, not
      this rule's to flag.

      Recorded 2026-09: the carve-out above was written when the rule was
      authored and left unimplemented. identity satisfies DOC-009 and its
      import package already matches its repo name, and it was still flagged
      twice on every run for a split this catalog explicitly sanctions.

  # ─────────────────────────────────────────────
  # ERROR HANDLING
  # ─────────────────────────────────────────────

  - id: PY-012
    title: FAILED_ prefix for failed inputs
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog]
    description: >
      Files that fail processing are renamed FAILED_<original> in the source folder
      for manual retry. Failed files must not be silently deleted or left unmarked.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Search all Python source files for the string 'FAILED_' in rename or
      move operations (shutil.move, os.rename, Path.rename). If the cog
      processes files and no FAILED_ rename pattern is found, flag as missing.
      Confirm FAILED_ prefix is applied in exception handlers, not just happy
      path code.

  - id: PY-013
    title: Deduplication handling is visible
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog]
    description: >
      A pipeline-cog or trigger-cog that processes potentially-repeating
      input shows explicit handling of duplicate input in its source.
      The specific mechanism is an implementation decision — common
      patterns include file-level renames (e.g. possible_duplicate_
      prefix), row-level uniqueness constraints with skip-on-conflict,
      content-hash dedup, or equivalent. The chosen strategy is
      recorded in docs/decisions/ as an ADR.

      Cogs whose inputs cannot contain duplicates by construction
      (e.g. a pure-compute transform over already-canonicalized input)
      are expected to declare this in evaluator.yaml as an exemption
      with a reason naming why duplicates are impossible.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Search all Python source files under src/ for any case-insensitive
      substring match against dedup-awareness signals:
        - 'dedup'
        - 'duplicate'
        - 'already exists'
        - 'already processed'
        - 'on_conflict'
        - 'on conflict'
        - 'integrityerror'
        - 'unique constraint'
        - 'uniqueviolation'
      If no signal is found, flag the cog — the source does not
      visibly acknowledge duplicate-input handling. The finding
      message names the missing signals and suggests adding explicit
      dedup handling or documenting why duplicates are impossible.

      This check does not verify the correctness of the dedup
      implementation — that is a semantic property beyond
      deterministic checking. The check establishes only that the
      cog has considered duplicates.

  - id: PY-014
    title: finally for temp file cleanup
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog]
    description: >
      Temp files created during processing are always cleaned up in a finally
      block regardless of success or failure.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Search all Python source files for temp file creation patterns (tempfile,
      NamedTemporaryFile, tmp_ prefixed paths). For each occurrence, confirm
      cleanup is performed inside a finally block. Flag any temp file creation
      not covered by a finally or context manager.

  - id: PY-015
    title: SQLAlchemy async pattern required in FastAPI services
    status: requirement
    dimension: structural_conformance
    severity: ERROR
    applies_to: [api-service]
    description: >
      FastAPI services use SQLAlchemy's async engine and session — AsyncEngine,
      async_sessionmaker, AsyncSession, and await session.execute(). Sync
      SQLAlchemy sessions (Session, sessionmaker) must not be used in an async
      FastAPI context. Sync sessions block the event loop and cause connection
      pool exhaustion under load. The asyncpg driver is required alongside
      SQLAlchemy async.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Search Python source files for SQLAlchemy imports. Flag any import of
      Session or sessionmaker from sqlalchemy.orm without the Async prefix.
      Flag any create_engine() call without create_async_engine(). Check
      pyproject.toml dependencies for asyncpg — flag if sqlalchemy is present
      but asyncpg is absent. Flag any session usage without await on execute,
      commit, or refresh calls.

  - id: PY-016
    title: External-service interfaces separate communication failure from response error
    status: requirement
    dimension: structural_conformance
    severity: ERROR
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      Any interface to an external service — Prefect Cloud, Google, Clerk,
      Anthropic, OpenAI, Spotify, AcoustID, MusicBrainz, Todoist, GitHub,
      or another Kaiano service — must let its caller tell these two
      conditions apart:

        COMMUNICATION FAILURE — no usable response was received. Connection
          refused, DNS failure, TLS failure, connect/read/write timeout,
          connection reset, truncated or unparseable response at the
          protocol level. We do not know whether the request took effect.

        RESPONSE ERROR — the provider answered and the answer is an error,
          or the payload is well-formed HTTP but unusable. Any 4xx or 5xx
          status, a schema mismatch, an unparseable body on a complete
          response. We know the outcome.

      The distinction is epistemic, not cosmetic: after a response error we
      know what happened, and after a communication failure we do not. That
      is what makes retry safety, idempotency (PIPE-013), and operator
      triage decidable. A 500 is a RESPONSE ERROR even though it means the
      provider is unhealthy, because we still know our request was received
      and rejected.

      This rule constrains only the *shape of the interface*, never the
      handling. What a caller does with either class — skip the step, fail
      the item, abort the run, exit the process — is application-dependent
      and deliberately unstandardized (ADR-007). The requirement exists so
      that differentiated handling is *possible* and intentional rather
      than accidental.

      Two acceptable implementations: distinct exception types for the two
      classes, or a single exception type carrying an explicit, documented
      discriminator (a boolean or enum field — not a sentinel value, and
      not the error message text).

      Known violations at authoring time, both in common-python-utils:
      `api/client.py` collapses both into `KaianoApiError` and discriminates
      only via an undocumented `status_code=0` sentinel, which is also used
      for a missing-secret config error; `llm/anthropic_client.py` wraps
      everything in `except Exception as e: raise LLMError(...)`, flattening
      an Anthropic outage, a malformed request, and a bad API key into one
      type with the distinction surviving only inside a formatted string.

      Where the transport supports it, further splitting COMMUNICATION
      FAILURE into "never arrived" (connect refused, DNS) and "sent, no
      answer" (read timeout, reset mid-flight) is valuable — only the
      second leaves a write in an unknown state — but it is not required
      here.

      TypeScript services are out of scope for now; no Hono service
      currently has a non-trivial external integration beyond Clerk. An
      XSTACK counterpart should be written when one does.
    checkable: true
    check_notes: >
      LLM CHECK.
      (1) [deterministic] Identify outbound-call sites: imports of or calls
          through httpx, requests, googleapiclient, spotipy, anthropic,
          openai, prefect client, musicbrainzngs, or acoustid.
      (2) [deterministic] Flag the collapsing anti-pattern — a bare
          `except Exception` (or `except BaseException`) wrapping such a
          call site whose handler raises a single error type built from an
          f-string interpolation of the caught exception, with no branch on
          the exception's class. This is the shape that destroys the
          distinction.
      (3) [deterministic] Flag sentinel discrimination — an error type whose
          only transport-vs-response signal is a magic value such as
          `status_code=0`, `status=None`, or `code=-1`. Sentinels are
          ambiguous and undocumented by construction; a named field is
          required.
      (4) [LLM] For each remaining external-service interface, judge whether
          a caller could branch on the two classes using only the public
          error surface — distinct types, or a documented discriminator
          field. Reading the exception's message string does not count.
      (5) [LLM] Confirm the interface's docstring states which class each
          error type or discriminator value represents. An undocumented
          distinction is one callers will not use.
      Do not flag on the basis of how callers *handle* the classes — this
      rule is about the interface only. A caller that catches both and does
      the same thing is compliant with this rule.
    origin: >
      2026-08 audit of every external-call surface in common-python-utils,
      prompted by the July fleet-down incident. google/_retry.py,
      spotify/spotify.py, and serve_resilience.py all separate the classes
      correctly; api/client.py and the llm/ clients do not. The
      inconsistency means a cog cannot reliably report whether the Kaiano
      API was unreachable or had rejected it — which is a precondition for
      CD-018 and for the provider attribution in ADR-007.

  - id: PY-017
    title: The released version is sourced from a committed version file
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library]
    description: >
      A Python repo that releases with semantic-release declares
      `dynamic = ["version"]` in `[project]` and sources the version from a
      one-line committed file via `[tool.hatch.version] path`. The release
      writes that file. `pyproject.toml` and `uv.lock` do not appear in the
      release commit.

      The reason is mechanical, not aesthetic. `uv.lock` records the
      project's OWN version, so bumping `[project] version` dirties the
      lockfile, so the release has to re-lock and commit `uv.lock` back to
      main. CD-006's `.gitattributes` rule forbids three-way merging a
      lockfile — correctly, because a clean text merge of two lockfiles once
      produced a duplicate `[[package]]` block that uv refused to parse,
      failing CI fleet-wide with no automatic repair. The result was that
      every release left every open branch one pull away from a manual
      conflict on a generated file. Making the version dynamic removes it
      from the lockfile, and the release commit becomes CHANGELOG.md plus a
      one-line Python file, both of which merge.

      NOT git tags. `hatch-vcs` was evaluated and rejected: Railway unpacks a
      source archive rather than cloning, so there is no `.git` in the build
      context and no tag to read, and setuptools_scm does not fail in that
      case — it silently emits `0.1.devN+g<sha>`. A committed file behaves
      identically in Actions, on Railway, and in a tarball with no git.

      This rule is Python-only by construction. npm requires `version` in
      `package.json`, and neither `pnpm-lock.yaml` nor the ecosystem's Node
      repos record the root version, so the problem does not exist there.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK. Applies only to repos with a `.releaserc.json`.
        (1) pyproject.toml `[project]` contains `dynamic = ["version"]` and
            does NOT contain a `version = "..."` key. Flag either half.
        (2) `[tool.hatch.version]` declares `path`, and that path exists.
        (3) The file at that path matches `^__version__ = "[^"]+"$` on some
            line. A file that does not is one hatchling cannot read.
        (4) The `@semantic-release/git` plugin's `assets` array contains that
            path, and contains NEITHER `pyproject.toml` NOR `uv.lock`. The
            assets list is the actual subject of this rule — (1)-(3) can all
            pass while the release still commits the lockfile.
        (5) The `@semantic-release/exec` `prepareCmd` does not invoke
            `uv version` or `uv lock`. Their presence means the old
            mechanism is still live regardless of what pyproject says.
      Do not flag a repo with no `.releaserc.json` — it does not release, so
      it has no release commit to keep clean.
    origin: >
      2026-09-06. Four repos hit rebase conflicts on uv.lock in one
      afternoon, each one a release commit colliding with local work on a
      file .gitattributes forbids merging. The fix was applied across all
      eight Python repos the same day; this rule keeps a new repo from
      reintroducing the pattern. See
      common-python-utils/docs/pypi-package-publishing.md and
      SPEC-file-sourced-version.md for the applied change.

# CFG-* rules moved to standards/config.yaml.
