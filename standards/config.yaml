# ecosystem-standards / config.yaml
# Standards for application configuration — pydantic-settings Settings classes
# and .env.example contracts. Split from python.yaml so each file owns exactly
# one rule prefix (CFG).

standards:

  - id: CFG-001
    title: No getattr() access for undeclared Settings fields
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, api-service, shared-library]
    description: >
      pydantic-settings with extra="ignore" silently drops env vars not declared
      as fields. Using getattr(settings, "KEY", default) on an undeclared key is
      always equivalent to using the hardcoded default. This pattern is prohibited.
      Any key accessed via settings.KEY or getattr(settings, "KEY", ...) must be
      declared as a typed field on the Settings class. Deferred fields must be
      documented in a commented-out stub block in config.py.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      AST scan: find all getattr(settings, ...) calls and verify the key name
      appears as a declared field on the Settings class. Also flag settings.KEY
      attribute access where KEY is not a declared field.
    origin: >
      routers/webhook.py uses getattr(settings, "STANDARDS_VERSION", "6.0") but
      STANDARDS_VERSION is not on Settings. The env var has no effect.

  - id: CFG-002
    title: Every key in .env.example must be declared in Settings
    status: convention
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, api-service, shared-library]
    description: >
      Any key in .env.example that is not a declared field on Settings creates a
      misleading contract. Exception: keys consumed by external tooling (RAILWAY_*,
      NODE_ENV) may be listed with a comment indicating they are not read by the app.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Parse .env.example keys. For each key, verify it appears as a declared field
      on Settings OR has a comment marking it as external tooling. Flag undocumented
      mismatches.
    origin: >
      KAIANO_API_CLERK_TOKEN appears in common-python-utils/.env.example but is
      not read anywhere in the current implementation.

  - id: CFG-003
    title: Local commands use the dev Doppler config unless named as production
    status: convention
    dimension: cd_readiness
    severity: WARN
    applies_to: [all]
    description: >
      Which Doppler config a command on a workstation reads, and which
      .env.example names that config must hold.

      Config. A repository that declares .env.example pins
      mini-app-polis-ecosystem / dev in its doppler.yaml, so
      `doppler run -- …` reads dev. That is the default for every local
      command. A command that has to act on production, such as an
      operator command against a production service or reading the task
      board, which exists only in production, says `--config prd`
      explicitly, and the repository's README names it as a production
      command where it documents it. A command never reaches production
      by inheriting a config it did not name.

      Required and optional names. .env.example lists the names the code
      reads, never values. An uncommented name is required in Doppler's
      dev config; a commented name is optional because the code has a
      default or reads it only in production. Where a value differs
      between environments by name, the dev-required name is the one
      dev reads (for example KAIANO_API_BASE_URL_DEV, since every
      environment other than production reads the _DEV name), and the
      production-only name stays commented. `uv run check-doppler-keys`
      (from miniapppolis-common-utils) then passes against dev.

      CD-011 keeps the rest of the Doppler policy and points here for
      local runs and required names.
    checkable: false
    origin: >
      CD-011 said local runs never use prd, while wiki-curator-cog ran
      about a dozen operator commands with `--config prd` and checking the
      board locally needs prd; several .env.example files marked the
      production-only KAIANO_API_BASE_URL required, so check-doppler-keys
      failed against dev.
