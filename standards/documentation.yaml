# ecosystem-standards / documentation.yaml
# Documentation standards for all repos, modules, and API endpoints.

standards:

  # ─────────────────────────────────────────────
  # REPO-LEVEL
  # ─────────────────────────────────────────────

  - id: DOC-001
    title: README.md is mandatory
    status: requirement
    dimension: documentation_coverage
    severity: ERROR
    applies_to: [all]
    description: >
      Every repo has a README. It describes: purpose (one paragraph), inputs,
      outputs, environment variables, how to run locally, how to run tests,
      and versioning policy.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check for README.md at repo root. Flag if absent or if it is clearly
      a template default with no real content.

  - id: DOC-002
    title: README describes inputs and outputs
    status: requirement
    dimension: documentation_coverage
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service]
    description: >
      For pipeline/trigger cogs: what files are expected, where they come from, what is
      produced and where it goes. For APIs: what endpoints exist and what they serve.

      Scoped to repos that have a well-defined input→output boundary. Static
      sites render content (the "input" is the content directory, not an
      external data source); react-apps consume APIs (the input/output
      description belongs on the API); shared libraries document their
      public API via docstrings and pyproject metadata. The pipeline-signal
      vocabulary used by the LLM check (source folder, produces, writes to,
      etc.) is a poor fit for those repo types.
    checkable: true
    check_notes: >
      LLM CHECK.
      Search README.md for sections or keywords describing inputs and outputs.
      For cogs: the README must contain at least two of the following keyword
      families in any section:
        - Input signals: "source folder", "Drive folder", "input files",
          "reads from", "consumes"
        - Output signals: "output", "produces", "writes to", "archive location",
          "destination"
      For APIs: look for endpoint
      listings or links to OpenAPI docs. Flag if README contains fewer than
      two of these signals.

  - id: DOC-003
    title: CHANGELOG.md required
    status: requirement
    dimension: documentation_coverage
    severity: WARN
    applies_to: [all]
    description: >
      Tracks meaningful changes per version. Not every commit — only changes that
      affect behavior, interface, or configuration. Managed by semantic-release.
      Never edited manually.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Check for CHANGELOG.md at repo root. Flag if absent.

  - id: DOC-004
    title: .env.example is current
    status: requirement
    dimension: documentation_coverage
    severity: WARN
    applies_to: [all]
    description: >
      Every environment variable the repository reads is listed in .env.example
      with a description, and nothing is listed that nothing reads. Names only,
      never values; CFG-003 says which names are required and which optional.
      Kept current — not a one-time artifact.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) Check for .env.example at repo root. Flag if absent.
      (2) Collect the names the repository reads: os.environ[...],
          os.environ.get(...) and os.getenv(...) in Python;
          import.meta.env.NAME and process.env.NAME (dot or bracket access)
          in TypeScript, JavaScript and Astro. Tests, build output and
          dependency folders are not scanned. A name built at runtime
          rather than written literally is not collected; a literal held
          in a module-level constant, or in a module-level dict of them,
          is collected where the read passes the constant or indexes
          the dict.
      (3) Collect the names .env.example lists, commented or not
          (NAME= or # NAME=).
      (4) Flag each name read in (2) but missing from (3).
      (5) Flag each name listed in (3) that nothing in (2) reads, unless
          it is marked as consumed by something other than the app (a
          shared library, a platform or a tool): a comment line starting
          "# external tooling" marks every name after it up to the next
          blank line, so one explanation can head a block of names. This
          is the CFG-002 marker.
      Settings class fields count as reads; CFG-002 covers the
      .env.example-to-Settings direction.

  - id: DOC-005
    title: Design decisions captured as ADRs
    status: requirement
    dimension: documentation_coverage
    severity: INFO
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library, standards-repo]
    description: >
      When a significant architectural decision is made, the rationale
      is captured as an Architecture Decision Record (ADR) in
      `docs/decisions/`. Each ADR uses the format:
        - `ADR-NNNN-short-slug.md`, where NNNN is four digits,
          zero-padded (`ADR-0001-federated-evaluation-config.md`)
        - Sections: Context, Decision, Consequences
      A bare ADR ID cites an ADR in the same repository. An ADR in
      another repository is cited as `<repo> ADR-NNNN`
      (`evaluator-cog ADR-0004`) or by its URL.
      ADRs record the "why" — what forces led to the decision, what
      was considered, what tradeoff was accepted. They are not a
      replacement for CHANGELOG entries (which record what changed),
      but they are the permanent record of why the ecosystem looks the
      way it does.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      For repos of the types in applies_to:
        (1) Check for existence of `docs/decisions/` directory. If
            the repo has fewer than 20 commits on main OR fewer than
            500 lines of source code, skip this check — too new to
            reasonably have ADRs. (Use git log and a simple wc -l
            against src/ to estimate.)
        (2) If the directory exists, verify at least one file in it
            matches the pattern `ADR-NNNN-*.md` where NNNN is four
            digits. Flag if no matching files exist.
        (3) If the directory does not exist AND the repo passes the
            size threshold in (1), flag as INFO: "no ADRs present on
            a non-trivial repo." Severity is INFO because absence of
            ADRs on an older repo is a known backfill need, not a
            blocking issue.
      Static sites and react apps are not in applies_to — frontend
      decisions are typically captured in the API-or-library repo
      they consume, not duplicated in the UI repo.

  - id: DOC-015
    title: An ADR's status and supersession links agree wherever they appear
    status: gap
    dimension: documentation_coverage
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, shared-library, standards-repo]
    description: >
      DOC-005 requires ADRs; this keeps them telling the truth about
      themselves once later decisions land. An ADR's status is stated in
      up to three places — its `**Status:**` header line, its row in
      `docs/decisions/README.md` where the repo keeps an index, and any
      current-state banner at the top of the file — and all three agree.

      Supersession and amendment are recorded at both ends, with the
      header lines `playbooks/new-adr.md` defines:
        `**Supersedes:** ADR-X`            pairs with `**Superseded by:** ADR-Y`
        `**Supersedes, in part:** ADR-X`   pairs with `**Superseded in part by:** ADR-Y`
        `**Amends:** ADR-X`                pairs with `**Amended by:** ADR-Y`
      An ADR whose status is Superseded names what superseded it, and that
      ADR names it back. A partially superseded or amended ADR stays
      Accepted (new-adr.md Step 7) and carries the matching `by` line.

      One end is not enough because readers arrive from either. Someone
      reading the old ADR needs to know it no longer wholly holds; someone
      reading the new one needs to know what it changed. A link written
      only from the new side leaves the old ADR reading as current, which
      is the failure this exists to stop.

      References to another repository's ADRs, or to things that are not
      ADRs (a rule ID, a document), are not held to the reciprocal test —
      the other end is not in this repository to check.

      `status: gap` until evaluator-cog registers the check (EVAL-007).
    checkable: false
    check_notes: >
      NOT CHECKABLE YET — no evaluator-cog check is registered. Promote to
      `requirement` and set `checkable: true` in the same change that
      registers it, with this as the check:

      LLM CHECK.
      If the repo has no `docs/decisions/` directory, skip without a
      finding (DOC-005 owns absence). Read every ADR file there, and its
      header: the lines before the first `---` rule or `## ` heading.
        (1) [deterministic] Status: the first word after `**Status:**`.
            Fail if absent or not one of new-adr.md's Step 5 statuses.
        (2) [deterministic] Index: if `docs/decisions/README.md` has a
            table with an ID and a Status column, fail for each ADR whose
            row status differs from (1), each ADR with no row, and each
            row with no file.
        (3) [deterministic] Relations: for every `**<relation>:**` header
            line, take the ADR IDs listed before the first em dash,
            parenthesis or line end. Normalise "Supersedes (partially)" to
            "Supersedes, in part". Ignore IDs qualified with another
            repository's name. For each ADR-X named, fail if X's header has
            no reciprocal line naming this ADR.
        (4) [deterministic] Fail if status is Superseded with no
            `Superseded by` line, or if a `Superseded by` line is present
            while status is anything else.
        (5) [LLM] Read any blockquote banner in the header region. Fail if
            it describes the ADR as superseded, replaced or amended by an
            ADR that no header relation line names, or if it contradicts
            (1).
      Name the ADR, the line and the counterpart file in each finding.
    origin: >
      2026-10, ecosystem-standards: ADR-0004 supersedes part of ADR-0002 and
      ADR-0009 part of ADR-0003, but each link was written at one end only;
      ADR-0009 amends ADR-0002 and ADR-0007, which say so, while ADR-0009 does
      not. The current-state notes added to those ADRs on 2026-10-16 were
      reconciled by hand.

  - id: DOC-014
    title: Living docs do not describe a retired component as current
    status: gap
    dimension: documentation_coverage
    severity: WARN
    applies_to: [all]
    description: >
      A repo's living documentation does not describe anything in the
      `retired:` registry in `index.yaml` as if it were still in use.
      Living documentation is the README, everything under `docs/`, the
      `.env.example`, and docstrings and comments in source — what a
      reader, human or agent, takes as a description of how things are
      now.

      Naming a retired component is fine when the sentence is about its
      retirement: what it was, what replaced it, when it went, why the
      code looks as it does. That provenance is the opposite of stale and
      is never a violation of this rule. It belongs in ADRs and the
      CHANGELOG, though, not in comments or docstrings: DOC-017 keeps
      history out of code comments. What is flagged is the present-tense survivor
      — a docstring telling callers what to do "when running under" a
      retired orchestrator, an `.env.example` key for a library that no
      longer exists — which tells the next reader to reach for something
      that is gone.

      Out of scope, because their job is history:
        - `docs/decisions/` — ADRs are preserved as written; their
          currency is DOC-015's concern.
        - `CHANGELOG.md` — semantic-release's record.
        - A file under `docs/` marked historical. The marker is the file's
          first non-blank line: an HTML comment beginning `<!-- historical`,
          optionally with a reason (`<!-- historical: migration journal,
          closed 2026-10 -->`). It declares the file a record of what
          happened rather than a description of what is, and is invisible
          when rendered, so the file should also say near its top what it
          records and that it is closed.
        - tests/, whose fixtures may name retired things on purpose.

      The registry is the list, so this rule names nothing itself: adding
      an entry to `retired:` is what extends the check. CD-019 already
      polices the retired authentication mechanisms in source and docs;
      they are not repeated in the registry.

      `status: gap` until evaluator-cog registers the check (EVAL-007).
    checkable: false
    check_notes: >
      NOT CHECKABLE YET — no evaluator-cog check is registered. Promote to
      `requirement` and set `checkable: true` in the same change that
      registers it, with this as the check:

      DETERMINISTIC CHECK.
      (1) Terms: every key of the catalog's `retired` block. Match each
          case-insensitively, bounded on both sides by the start or end of
          the text or a character that is not a letter or digit — so
          `PREFECT_API_KEY` and "Prefect-era" match, and a longer word
          that merely contains the term does not.
      (2) Files: README.md at the root; every file under docs/ except
          docs/decisions/ and files whose first non-blank line begins
          `<!-- historical`; `.env.example`; and in source files under
          src/, only comments and docstrings (Python: comments and
          docstrings, via the tokenizer and AST; TypeScript: `//` and
          `/* */` comments). Skip CHANGELOG.md and tests/.
      (3) Provenance: split the text around a match into sentences (on
          `.`, `?`, `!` or a blank line). A match is allowed when its
          sentence also contains, case-insensitively, any of: retire,
          retired, replaced, removed, superseded, deprecated, formerly,
          previously, "no longer", "used to", "moved off", "migrated
          from", "merged from", "instead of", "in place of", legacy,
          historical. A `.env.example` key is never provenance — a key is
          a name the service still reads; a comment line there is prose
          and takes the provenance test.
      (4) Fail once per file, listing each unallowed match with its line
          number, the term, and the registry's `replaced_by` for it, so
          the finding carries its own fix.
    origin: >
      2026-10: after a run of retirements, docstrings in
      common-python-utils still told callers how to behave under the
      retired orchestrator, and three ADRs here needed current-state notes.
      Each retirement relied on a grep someone remembered to run
      (playbooks/ecosystem-changes.md §1), against names nobody had
      written down.

  - id: DOC-016
    title: Code and tests name another repo's public contract, never its internals
    status: requirement
    dimension: documentation_coverage
    severity: WARN
    applies_to: [all]
    description: >
      Each repo is self-contained. Its code and tests may name another
      repo and link that repo's public contract — an API route, an
      OpenAPI document, the repo's name — but never cite what that repo
      keeps to itself: its files, symbols, Terraform resource names,
      migrations or constants, or a private tracker such as the task
      board. A citation of another repo's internals goes stale the moment
      that repo changes, and nothing in this repo tells the reader it has.

      Scope is source code and tests only. README.md, docs/,
      CHANGELOG.md and docs/decisions/ are out of scope: a document may
      describe how the repo fits with others.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) Files: source files under src/ and tests/ (any language the
          repo holds). Skip README.md, docs/, docs/decisions/ and
          CHANGELOG.md.
      (2) Deny patterns, each a regex over the file's text:
          - `MINI-\d+` — a task-board ticket id.
          - `app.asana.com/0/\d` — a task-board link.
          - a `*.tf` file name, except in `infrastructure` repos,
            which own their Terraform.
          - "migration NNN" (three digits) or an `NNN_name.sql` file
            name, except in `api-service` repos, which own their
            migrations.
      (3) Fail once per file, listing each match with its line number
          and the pattern it matched.
    origin: >
      2026-10-20: a sweep of the fleet found code and tests citing
      other repos' files, Terraform resources, migration numbers and
      board tickets, each of which had gone stale or would.

  - id: DOC-017
    title: Code comments describe the code as it is, not its history
    status: requirement
    dimension: documentation_coverage
    severity: WARN
    applies_to: [all]
    description: >
      Comments and docstrings describe the code as it is now. How it got
      here — what it replaced, what was renamed or moved, when it changed
      — goes in an ADR or the CHANGELOG, where history is the point and a
      reader looks for it. A comment narrating history is true on the day
      it is written and misleading soon after, and it crowds out what the
      reader needs: what the code does and why.

      Scope is source code and tests only. README.md, docs/,
      CHANGELOG.md and docs/decisions/ are out of scope.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      (1) Files: source files under src/ and tests/, comments and
          docstrings only (Python: comments and docstrings, via the
          tokenizer and AST; TypeScript: `//` and `/* */` comments).
          Skip README.md, docs/, docs/decisions/ and CHANGELOG.md.
      (2) Phrases, matched case-insensitively on word boundaries:
          "previously", "used to", "no longer", "was changed",
          "was renamed", "moved from", "as of <date>" (a date in any
          common form), "originally".
      (3) Fail once per file, listing each match with its line number
          and the phrase it matched.
    origin: >
      2026-10-20: the same fleet sweep found comments recounting what
      code used to do and when it changed, which had drifted from the
      code they sat on.

  # ─────────────────────────────────────────────
  # CODE-LEVEL
  # ─────────────────────────────────────────────

  - id: DOC-006
    title: Docstrings on all public functions and classes
    status: requirement
    dimension: documentation_coverage
    severity: WARN
    applies_to: [all]
    description: >
      All public functions and classes have docstrings. One sentence minimum
      describing what the function does, not how.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      AST scan: find public functions and classes (not prefixed with _) lacking
      a docstring. Flag if any exist.

  - id: DOC-007
    title: Pydantic field descriptions required
    status: requirement
    dimension: documentation_coverage
    severity: WARN
    applies_to: [pipeline-cog, api-service]
    description: >
      Pydantic model fields use the description parameter. Models are
      self-documenting — no separate documentation needed for data shapes.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Search all Python source files for Pydantic BaseModel subclasses. For
      each model field definition, check whether a Field(..., description=...)
      or Field(description=...) call is present. Flag any model field using
      plain type annotation without a Field description. Allow exemptions for
      private fields prefixed with underscore.

  - id: DOC-008
    title: No dead code
    status: requirement
    dimension: structural_conformance
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, react-app]
    description: >
      Commented-out code is removed, not left in place. Version control is the
      history — the codebase is the present.

      Scoped to repos with an active code surface. Static sites are primarily
      content (commented-out Markdown / HTML structure is not dead code in the
      same sense); shared libraries intentionally retain commented reference
      implementations for API callers; the standards repo is catalog YAML.
    checkable: true
    check_notes: >
      LLM CHECK.
      Scan for large blocks of commented-out code (3+ consecutive commented lines
      that appear to be code, not documentation). Flag if found.

  - id: DOC-009
    title: Split package identity documented at entry point
    status: requirement
    dimension: documentation_coverage
    severity: WARN
    applies_to: [all]
    description: >
      If a Python library's install name (pyproject.toml [project] name) differs
      from its import namespace (src/ directory name), both names and their
      relationship must be documented in __init__.py docstring. README must show
      both correct install snippet and correct import path.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Compare [project] name in pyproject.toml against directory name under src/.
      If they differ, verify __init__.py docstring mentions both names and README
      contains both install and import examples.
    origin: >
      common-python-utils/__init__.py had broken install URL and no explanation
      of the name split. New consumers had to discover the import namespace by
      inspecting src/.

  # ─────────────────────────────────────────────
  # API DOCUMENTATION
  # ─────────────────────────────────────────────

  - id: DOC-010
    title: OpenAPI docs are first-class
    status: requirement
    dimension: documentation_coverage
    severity: ERROR
    applies_to: [api-service]
    description: >
      FastAPI's /docs is a deliverable, not a side effect. Every endpoint must
      be complete and accurate before the service is considered done. All endpoints
      have summary, description, and response_model defined.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      Scan FastAPI route decorators for presence of summary=, description=, and
      response_model=. Flag any endpoint missing any of the three.

  - id: DOC-011
    title: Public endpoints documented as intentional
    status: requirement
    dimension: documentation_coverage
    severity: WARN
    applies_to: [all]
    description: >
      Public (unauthenticated) endpoints include a note in their description
      confirming they are intentionally public.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      For FastAPI services, identify routes with no auth dependency (no
      Depends(verify_token) or equivalent in the route signature). Exempt
      standard infrastructure endpoints: /health, /metrics, /docs,
      /openapi.json, /redoc. For each remaining unauthenticated route —
      including /version and any application-level endpoints — check the
      OpenAPI description field contains a phrase confirming intent —
      e.g. "intentionally public", "no auth required", "read-only public".
      Flag unauthenticated routes with no such note. The rationale: DOC-011
      is the place to record *why* a route is public, so that API-008's
      flag becomes resolvable by writing the justification into the
      description rather than by exempting the rule.

  - id: DOC-013
    title: README "Running locally" section is complete
    status: requirement
    dimension: documentation_coverage
    severity: WARN
    applies_to: [pipeline-cog, trigger-cog, api-service, static-site, react-app]
    description: >
      Every repo's README includes a "Running locally" section that covers
      five conceptual elements, expressed in the idioms of the repo's stack.

      Python repos (cogs, FastAPI services, libraries):
        (1) prerequisites — Python version (≥3.11) and uv
        (2) install — `uv sync --all-extras`
        (3) pre-commit — `uv run pre-commit install` and
            `uv run pre-commit run --all-files`
        (4) run — the exact command(s) to start the service or scripts
        (5) test — `uv run pytest` and the coverage variant

      TypeScript API services (Hono):
        (1) prerequisites — Node.js version and pnpm
        (2) install — `pnpm install`
        (3) lint/type-check — `pnpm lint` and `pnpm typecheck`
        (4) run — `pnpm dev` or equivalent dev server command
        (5) test — `pnpm test`

      Frontend sites and apps (Astro, React/Vite):
        (1) prerequisites — Node.js version and pnpm (or npm)
        (2) install — `pnpm install`
        (3) environment — copy `.env.example` to `.env` and fill values
        (4) run — `pnpm dev` or `astro dev`
        (5) build — `pnpm build` and confirm it succeeds

      The section must be kept current. Copy-paste from the README must
      work on a clean clone with no prior knowledge of the repo.
    checkable: true
    check_notes: >
      DETERMINISTIC CHECK.
      For Python repos: scan README.md for uv sync, pre-commit install,
      pre-commit run --all-files, uv run pytest, and a prerequisites
      mention (Python version or uv). Flag if any of the five are missing.

      For TypeScript API repos (api-service / Hono): scan for pnpm install,
      pnpm dev (or equivalent), pnpm test, and a Node.js prerequisites
      mention.

      For frontend repos (static-site, react-app): scan for an
      install command (pnpm install OR npm install), a dev command (pnpm dev,
      npm run dev, or astro dev), a build command (pnpm build or npm run build),
      and a reference to .env.example. Accept either package manager — do NOT
      flag npm as a violation for frontend repos. Flag only if the conceptual
      element (install / dev / build / env setup) is entirely absent.

